<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agência BC">
<title>Agência BC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Agência BC · quadro de controle.
   Layout: barra fixa com abas; conteúdo em blocos separados por filete (não em cartões);
   tabelas densas; o farol (verde/amarelo/vermelho, sempre com texto) é o sinal principal. */
:root {
  /* Paleta da identidade Bruno Coelho: preto, lima e azul. Escuro é o padrão da marca. */
  --bg: #08090C;
  --surface: #111319;
  --surface-2: #1A1D25;
  --ink: #F4F4F0;
  --ink-2: #A3A5AE;
  --ink-3: #80838D;
  --line: #262932;
  --accent: #C6FF3D;
  --accent-ink: #0A0D02;
  --accent-soft: #171C08;
  --blue: #3D5CFF;
  --blue-txt: #7F95FF;
  --ok: #4CC38A;      --ok-soft: #10281C;
  --warn: #E3B341;    --warn-soft: #2F2509;
  --bad: #FF7A70;     --bad-soft: #351513;
  --f-display: 'Anton', 'Arial Narrow', Impact, sans-serif;
  --f-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --raio: 0px;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #F4F4F0; --surface: #FFFFFF; --surface-2: #E9E9E3; --ink: #08090C; --ink-2: #4A4C55; --ink-3: #6B6D76;
  --line: #D4D4CC; --accent: #3D5CFF; --accent-ink: #FFFFFF; --accent-soft: #E3E8FF;
  --blue: #3D5CFF; --blue-txt: #3D5CFF;
  --ok: #1B7F4B; --ok-soft: #DCF0E4; --warn: #8F5B00; --warn-soft: #F7EACB; --bad: #B3261E; --bad-soft: #F8DEDB;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  margin: 0;
}
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 28px; line-height: 1.1; font-weight: 800; }
h2 { font-size: 13px; font-weight: 700; font-family: var(--f-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); }
h3 { font-size: 18px; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
.mono { font-family: var(--f-mono); }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: 13px; }
.nowrap { white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ───────── barra superior ───────── */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.topbar-in { max-width: 1120px; margin: 0 auto; padding: 10px 16px 0; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.marca { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.marca-sigla {
  width: 30px; height: 30px; display: grid; place-items: center;
  background: var(--accent); color: var(--accent-ink); border-radius: 4px;
  font-family: var(--f-display); font-weight: 800; font-size: 14px; letter-spacing: 0.02em;
}
.marca-nome { font-family: var(--f-display); font-weight: 800; font-size: 18px; letter-spacing: -0.01em; }
.topbar-acoes { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.nav { max-width: 1120px; margin: 0 auto; padding: 0 16px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a {
  padding: 10px 12px 9px; text-decoration: none; color: var(--ink-2); white-space: nowrap;
  font-weight: 500; font-size: 14px; border-bottom: 2px solid transparent;
}
.nav a:hover { color: var(--ink); }
.nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }

.pagina { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 22px 56px; }
.pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; margin-bottom: 18px; }
.pagehead .sub { color: var(--ink-2); margin-top: 4px; }
.pagehead-acoes { display: flex; gap: 8px; flex-wrap: wrap; }

/* ───────── botões ───────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 36px; padding: 6px 13px; border-radius: var(--raio); cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font-weight: 500; font-size: 14px; text-decoration: none; line-height: 1.2;
}
.btn:hover { border-color: var(--ink-3); }
.btn.primario { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primario:hover { filter: brightness(1.08); }
.btn.perigo { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.mini { min-height: 30px; padding: 3px 10px; font-size: 13px; }
.btn.fantasma { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.fantasma:hover { color: var(--ink); background: var(--surface-2); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font: inherit; text-decoration: underline; text-underline-offset: 2px; }

/* ───────── faixa de indicadores ───────── */
.faixa { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border-block: 1px solid var(--line); margin-bottom: 26px; }
.faixa > div { padding: 12px 16px 12px 0; }
.faixa > div + div { border-left: 1px solid var(--line); padding-left: 16px; }
.faixa .rot { font-family: var(--f-mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); }
.faixa .val { font-family: var(--f-display); font-weight: 800; font-size: 26px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.faixa .nota { font-size: 12.5px; color: var(--ink-2); }
@media (max-width: 560px) {
  .faixa > div:nth-child(odd) { border-left: 0; padding-left: 0; }
  .faixa > div:nth-child(n+3) { border-top: 1px solid var(--line); }
}

/* ───────── blocos e colunas ───────── */
.colunas { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 28px 40px; align-items: start; }
.bloco { border-top: 2px solid var(--ink); padding-top: 10px; min-width: 0; margin-bottom: 4px; }
.bloco-cab { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
.bloco + .bloco { margin-top: 0; }
.espaco { margin-top: 28px; }
.vazio { color: var(--ink-2); padding: 14px 0; font-size: 14px; }
.aviso { background: var(--accent-soft); border: 1px solid var(--line); border-radius: var(--raio); padding: 10px 14px; margin-bottom: 20px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-size: 14px; }
.aviso.warn { background: var(--warn-soft); }

/* ───────── listas de linhas ───────── */
.linhas { list-style: none; margin: 0; padding: 0; }
.linhas > li { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); }
.linhas > li:last-child { border-bottom: 0; }
.linhas .corpo { min-width: 0; flex: 1; }
.linhas .tit { font-weight: 600; overflow-wrap: anywhere; }
.linhas .det { color: var(--ink-2); font-size: 13.5px; overflow-wrap: anywhere; }
.linhas .acoes { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }

/* ───────── pílulas ───────── */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 7px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; line-height: 1.5; background: var(--surface-2); color: var(--ink); }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
.pill.verde, .pill.otimo, .pill.positivo { background: var(--ok-soft); color: var(--ok); }
.pill.amarelo, .pill.regular, .pill.neutro { background: var(--warn-soft); color: var(--warn); }
.pill.vermelho, .pill.ruim, .pill.negativo { background: var(--bad-soft); color: var(--bad); }
.pill.neutra { background: var(--surface-2); color: var(--ink-2); }
.pill.sem-ponto::before { display: none; }
.pill.sem-ponto { padding-left: 9px; }
.tag { display: inline-block; padding: 0 7px; border-radius: 3px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); font-family: var(--f-mono); white-space: nowrap; }
.tag.acc { background: var(--accent-soft); color: var(--accent); }
.curva { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 4px; font-family: var(--f-mono); font-weight: 700; font-size: 12px; background: var(--surface-2); color: var(--ink-2); }
.curva.A { background: var(--accent); color: var(--accent-ink); }
.curva.B { background: var(--accent-soft); color: var(--accent); }

/* ───────── tabelas ───────── */
.rolagem { overflow-x: auto; max-width: 100%; }
.tabela { width: 100%; border-collapse: collapse; font-size: 14px; }
.tabela th { text-align: left; font-family: var(--f-mono); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); padding: 8px 12px 8px 0; border-bottom: 1px solid var(--ink-3); white-space: nowrap; }
.tabela th.num { text-align: right; }
.tabela td { padding: 10px 12px 10px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tabela td:last-child, .tabela th:last-child { padding-right: 0; }
.tabela tr.clicavel { cursor: pointer; }
.tabela tr.clicavel:hover td { background: var(--surface-2); }
.tabela tfoot td { border-bottom: 0; font-weight: 600; }
.tabela .nome { font-weight: 600; overflow-wrap: anywhere; }
.tabela .truncar { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
@media (max-width: 720px) { .hide-s { display: none; } }

/* ───────── formulários e diálogos ───────── */
dialog { border: 1px solid var(--line); border-radius: 10px; padding: 0; background: var(--surface); color: var(--ink); width: min(720px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); }
dialog.estreito { width: min(520px, calc(100vw - 24px)); }
dialog::backdrop { background: rgba(10, 14, 16, .55); }
.dlg { padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 16px; }
.dlg-cab { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.dlg-cab p { color: var(--ink-2); font-size: 14px; margin-top: 2px; }
.dlg-rodape { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; position: sticky; bottom: 0; background: var(--surface); padding-top: 10px; border-top: 1px solid var(--line); }
.dlg-rodape .esq { margin-right: auto; }
.grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px 14px; }
.campo { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.campo.largo { grid-column: 1 / -1; }
.campo > label, .rotulo { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.campo small { color: var(--ink-3); font-size: 12.5px; }
input[type="text"], input[type="tel"], input[type="number"], input[type="date"], input[type="email"], input[type="password"], input[type="search"], select, textarea {
  width: 100%; min-height: 38px; padding: 7px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--raio); color: var(--ink);
}
textarea { min-height: 76px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
.secao { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 12px; }
.secao > h2 { margin-bottom: -2px; }
.erro-form { color: var(--bad); font-size: 14px; font-weight: 500; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--raio); overflow: hidden; background: var(--bg); }
.seg label { margin: 0; cursor: pointer; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: grid; place-items: center; width: 40px; height: 36px; font-family: var(--f-mono); font-weight: 600; color: var(--ink-2); border-right: 1px solid var(--line); }
.seg label:last-child span { border-right: 0; }
.seg input:checked + span { background: var(--accent); color: var(--accent-ink); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: -2px; }
.crit { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.crit:last-of-type { border-bottom: 0; }
.crit .q { font-size: 13px; color: var(--ink-2); }
.crit .nome { font-weight: 600; }
.crit .peso { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3); margin-left: 6px; }
@media (max-width: 560px) { .crit { grid-template-columns: 1fr; } }
.notaviva { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding: 10px 12px; background: var(--surface-2); border-radius: var(--raio); }
.notaviva .grande { font-family: var(--f-display); font-weight: 800; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.checks { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 4px 16px; }
.check { display: flex; gap: 9px; align-items: flex-start; padding: 5px 0; cursor: pointer; font-size: 14px; }
.check input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--accent); flex: none; }
.cascata { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--raio); overflow: hidden; }
.cascata label { display: grid; grid-template-columns: auto 22px minmax(0, 1fr); gap: 4px 10px; align-items: start; padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.cascata label:last-child { border-bottom: 0; }
.cascata label:has(input:checked) { background: var(--accent-soft); }
.cascata input { margin-top: 4px; accent-color: var(--accent); }
.cascata .ord { font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); padding-top: 2px; }
.cascata .t { font-weight: 600; }
.cascata .d { font-size: 13px; color: var(--ink-2); }

/* ───────── abas internas, progresso ───────── */
.abas { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; scrollbar-width: none; }
.abas button { background: none; border: 0; padding: 8px 14px; cursor: pointer; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500; white-space: nowrap; }
.abas button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.progresso { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.progresso > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.progresso.ok > i { background: var(--ok); }
.resumo-pros { display: flex; gap: 20px 32px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
.resumo-pros .item { min-width: 150px; }
.resumo-pros .rot { font-family: var(--f-mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); }
.resumo-pros .val { font-family: var(--f-display); font-weight: 800; font-size: 24px; font-variant-numeric: tabular-nums; }

/* ───────── cliente: cabeçalho ───────── */
.cli-cab { display: flex; justify-content: space-between; gap: 16px 28px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 18px; }
.cli-cab .motivos { margin-top: 8px; display: flex; flex-direction: column; gap: 2px; font-size: 14px; color: var(--ink-2); }
.cli-cab .motivos li { list-style: none; }
.cli-cab ul { margin: 0; padding: 0; }
.voltar { display: inline-block; margin-bottom: 8px; font-size: 14px; color: var(--ink-2); text-decoration: none; }
.voltar:hover { color: var(--ink); }
.graficos { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 20px 32px; margin-bottom: 22px; }
.graf-tit { font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 4px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
svg.graf { width: 100%; height: auto; display: block; overflow: visible; }
svg.graf text { fill: var(--ink-2); font-family: var(--f-mono); font-size: 11px; }
svg.graf .grade { stroke: var(--line); stroke-width: 1; fill: none; }
svg.graf .eixo { stroke: var(--ink-3); stroke-width: 1; }
.legenda { display: flex; gap: 6px 18px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); margin: 6px 0 2px; }
.legenda i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.dica { position: fixed; z-index: 60; pointer-events: none; background: var(--ink); color: var(--bg); padding: 6px 10px; border-radius: 4px; font-size: 12.5px; line-height: 1.35; max-width: 240px; }

/* ───────── quadro (kanban) ───────── */
.quadro { display: grid; grid-auto-flow: column; grid-auto-columns: 252px; gap: 12px; overflow-x: auto; padding-bottom: 10px; align-items: start; }
.col { background: var(--surface-2); border-radius: 8px; padding: 8px; min-height: 120px; }
.col-cab { display: flex; justify-content: space-between; align-items: center; padding: 2px 4px 8px; font-weight: 700; font-size: 13.5px; }
.col-cab span { font-family: var(--f-mono); font-weight: 500; color: var(--ink-2); }
.cartao { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; margin-bottom: 8px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
.cartao:hover { border-color: var(--ink-3); }
.cartao .t { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
.cartao .d { font-size: 12.5px; color: var(--ink-2); overflow-wrap: anywhere; }
.cartao .linha { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.atrasado { color: var(--bad); font-weight: 600; }
.hoje-c { color: var(--warn); font-weight: 600; }

.filtros { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
.filtros select, .filtros input { width: auto; min-width: 140px; flex: 1 1 140px; max-width: 260px; }

/* ───────── barras horizontais (motivos, funil) ───────── */
.barras { display: flex; flex-direction: column; gap: 8px; }
.barra { display: grid; grid-template-columns: minmax(110px, 190px) minmax(0, 1fr) 84px; gap: 4px 12px; align-items: center; font-size: 14px; }
.barra .trilho { height: 10px; background: var(--surface-2); border-radius: 0 4px 4px 0; position: relative; }
.barra .trilho i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 0 4px 4px 0; min-width: 2px; }
.barra .v { font-family: var(--f-mono); text-align: right; font-size: 13px; white-space: nowrap; }
@media (max-width: 560px) { .barra { grid-template-columns: minmax(0, 1fr) 70px; } .barra .trilho { grid-column: 1 / -1; grid-row: 2; } }

/* ───────── importação ───────── */
.mapa { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 10px 14px; }
.previa { max-height: 220px; overflow: auto; border: 1px solid var(--line); border-radius: var(--raio); }
.previa table { font-size: 12.5px; }
.previa td, .previa th { padding: 5px 10px 5px 8px; white-space: nowrap; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 80; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 6px; font-size: 14px; max-width: calc(100vw - 32px); box-shadow: 0 6px 24px rgba(0,0,0,.25); }
.toast.erro { background: var(--bad); color: var(--bg); }
.login { max-width: 380px; margin: 12vh auto 0; padding-inline: 16px; display: flex; flex-direction: column; gap: 16px; }

@media (prefers-reduced-motion: no-preference) {
  .progresso > i { transition: width .3s ease; }
}


/* ───────── identidade Bruno Coelho: cantos retos, Anton em caixa-alta, losangos, filetes ───────── */
html { scroll-behavior: smooth; }
body { -webkit-font-smoothing: antialiased; }
h1 { font-weight: 400; text-transform: uppercase; letter-spacing: 0.005em; line-height: 0.98; font-size: clamp(30px, 5vw, 44px); }
h2 { font-family: var(--f-body); font-size: 12px; font-weight: 600; letter-spacing: 0.14em; color: var(--blue-txt); display: inline-flex; align-items: center; gap: 10px; }
h2::before { content: ""; width: 16px; height: 1px; background: currentColor; flex: none; }
h3 { font-weight: 700; font-family: var(--f-body); }
.faixa .val, .resumo-pros .val { font-weight: 400; letter-spacing: 0.01em; }
.faixa .rot, .resumo-pros .rot { font-family: var(--f-body); font-weight: 600; letter-spacing: 0.12em; }
.topbar { background: rgba(8, 9, 12, .86); backdrop-filter: blur(10px); }
:root[data-theme="light"] .topbar { background: rgba(244, 244, 240, .88); }
.marca-sigla { width: 38px; height: 38px; background: transparent; color: var(--ink); border: 1.5px solid var(--line); border-radius: 0; font-weight: 400; font-size: 15px; position: relative; padding-bottom: 6px; }
.marca-sigla::after { content: ""; position: absolute; bottom: 5px; left: 50%; width: 9px; height: 2px; margin-left: -9px; background: var(--blue); box-shadow: 12px 0 0 -0.5px var(--accent); }
.marca-nome { font-family: var(--f-body); font-weight: 800; font-size: 15px; letter-spacing: 0.02em; text-transform: uppercase; }
.nav a { font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; font-weight: 600; }
.nav a[aria-current="page"] { border-bottom-color: var(--accent); }
.btn.primario { font-weight: 800; letter-spacing: 0.02em; }
.btn.primario:hover { filter: none; transform: translateY(-1px); box-shadow: 0 10px 28px -12px var(--accent); }
.bloco { border-top: 1px solid var(--line-strong, var(--line)); }
.pill { border-radius: 0; }
.pill::before { border-radius: 0; width: 7px; height: 7px; transform: rotate(45deg); }
.progresso, .progresso > i, .barra .trilho, .barra .trilho i { border-radius: 0; }
dialog { border-radius: 0; border-color: var(--line); }
dialog::backdrop { background: rgba(0, 0, 0, .7); }
.toast, .dica, .tag, .curva, .col, .cartao { border-radius: 0; }
.toast.erro { color: var(--bg); }
.legenda i { border-radius: 0; }
a { color: var(--accent); }
:root[data-theme="light"] a { color: var(--blue); }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .btn.primario:hover { transform: none; } }

/* ───────── prospecção: layout do painel ───────── */
.pros-topo { display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; margin-bottom: 22px; }
.pill-marca { display: inline-block; padding: 7px 14px; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
.pros-meta { display: flex; align-items: center; gap: 8px 20px; flex-wrap: wrap; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.pros-meta label { display: inline-flex; align-items: center; gap: 8px; }
.pros-meta input { width: 64px; min-height: 30px; padding: 3px 8px; text-align: center; }
.losango { display: inline-block; width: 9px; height: 9px; background: var(--accent); transform: rotate(45deg); margin-right: 8px; vertical-align: 1px; }
.pros-h1 { font-size: clamp(32px, 6vw, 62px); max-width: 920px; line-height: .96; }
.marca-texto { background: var(--accent); color: var(--accent-ink); padding: 0 .12em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.pros-sub { max-width: 640px; margin-top: 18px; color: var(--ink-2); font-size: 16px; line-height: 1.65; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px; margin: 26px 0 18px; }
.kpi { border: 1px solid var(--line); background: var(--surface); padding: 12px 14px; min-width: 0; }
.kpi .rot { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); min-height: 2.6em; }
.kpi .val { font-family: var(--f-display); font-size: 30px; line-height: 1.1; margin-top: 4px; }
.kpi.dest { background: var(--accent); border-color: var(--accent); }
.kpi.dest .rot, .kpi.dest .val { color: var(--accent-ink); }
.pra-hoje { border: 1px solid var(--blue); margin-bottom: 18px; background: var(--surface); }
.ph-cab { background: var(--blue); color: #fff; display: flex; justify-content: space-between; padding: 10px 16px; font-weight: 800; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
.ph-corpo { padding: 12px 16px; }
.ph-ok { color: var(--ink-2); } .ph-ok strong { color: var(--ok); }
.barra-fer { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
.barra-fer input[type="search"] { width: 220px; max-width: 100%; }
.barra-fer select { width: auto; min-width: 0; max-width: 100%; }
.barra-fer-fim { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
.seg label { cursor: pointer; } .seg label input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) span { background: var(--accent); color: var(--accent-ink); }
.seg label span { display: inline-flex; align-items: center; min-height: 36px; }

.novo-contato { border: 1px solid var(--line); background: var(--surface); padding: 20px; margin-bottom: 18px; display: flex; flex-direction: column; gap: 16px; }
.nc-cab { display: flex; gap: 12px; align-items: flex-start; }
.nc-cab h3 { font-size: 14px; font-weight: 800; letter-spacing: .06em; font-family: var(--f-body); }
.nc-mais { width: 30px; height: 30px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-weight: 800; flex: none; }
.nc-grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); gap: 14px; }
.nc-rodape { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }

.chip { display: inline-block; padding: 1px 9px; font-size: 12px; font-weight: 700; border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.chip.hoje { background: var(--blue); border-color: var(--blue); color: #fff; }
.chip.atrasado { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.chip.acc { border-color: var(--blue); color: var(--blue-txt); }
.ico-linha { display: inline-flex; gap: 6px; }
.ico-c { display: inline-grid; place-items: center; min-width: 30px; height: 30px; padding: 0 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 12px; font-weight: 800; text-decoration: none; }
a.ico-c:hover { border-color: var(--accent); color: var(--accent); }
.ico-c.off { opacity: .35; }
.btn-av { background: var(--accent); color: var(--accent-ink); border: 0; font-weight: 800; font-size: 13px; padding: 5px 12px; cursor: pointer; }
.btn-av:hover { filter: brightness(1.08); }
.cartao { gap: 8px; border-color: var(--line); padding: 12px; }
.cartao:hover, .cartao:focus-visible { border-color: var(--accent); }
.cartao .t { font-size: 15px; font-weight: 700; }
.quadro { grid-auto-columns: 270px; }
.col { padding: 10px; }
.col-cab { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; font-family: var(--f-body); }
.col-cab span { background: var(--accent); color: var(--accent-ink); padding: 0 9px; font-weight: 800; font-size: 12px; font-family: var(--f-body); }

/* gaveta lateral */
dialog.gaveta { margin: 0 0 0 auto; width: min(460px, 100vw); height: 100dvh; max-height: 100dvh; border-width: 0 0 0 1px; border-radius: 0; animation: gv-in .22s ease-out; }
@keyframes gv-in { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { dialog.gaveta { animation: none; } }
.gv { padding: 0; gap: 0; min-height: 100%; }
.gv-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 20px; background: var(--bg); border-bottom: 2px solid var(--accent); position: sticky; top: 0; z-index: 2; }
.gv-cab h3 { font-family: var(--f-body); font-size: 19px; font-weight: 800; }
.gv-cab p { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
.gv-x { background: none; border: 0; color: var(--ink); font-size: 28px; line-height: 1; cursor: pointer; padding: 0 4px; }
.gv-corpo { padding: 20px; display: flex; flex-direction: column; gap: 16px; flex: 1; }
.gv-links { display: flex; }
.gv-mais summary { cursor: pointer; font-size: 13px; font-weight: 700; color: var(--ink-2); }
.gv-mais-corpo { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
.gv-acoes { display: flex; gap: 8px; flex-wrap: wrap; }
.gv-hist { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.gv-meta { border-top: 1px solid var(--line); padding-top: 12px; }
.gv-rodape { position: sticky; bottom: 0; display: flex; gap: 8px; flex-wrap: wrap; padding: 14px 20px; background: var(--surface); border-top: 1px solid var(--line); }
.gv-rodape .perigo { margin-left: auto; }

/* espaço da logo */
.marca-logo { height: 38px; min-width: 38px; max-width: 160px; object-fit: contain; flex: none; display: block; }
.marca-logo.vazio { width: 38px; border: 1px dashed var(--line); }

/* celular */
@media (max-width: 640px) {
  body { font-size: 15px; }
  .btn { min-height: 44px; } .btn.mini { min-height: 40px; }
  input[type="text"], input[type="tel"], input[type="number"], input[type="date"], input[type="email"], input[type="password"], input[type="search"], select, textarea { min-height: 44px; font-size: 16px; }
  .nav a { padding: 12px 12px 11px; }
  .pagehead-acoes { width: 100%; }
  .barra-fer > * { flex: 1 1 100%; } .barra-fer .btn-av { flex: none; }
  .barra-fer .seg { display: flex; } .barra-fer .seg label { flex: 1; text-align: center; } .barra-fer .seg label span { width: 100% !important; justify-content: center; }
  .barra-fer-fim { margin-left: 0; } .barra-fer-fim .btn { flex: 1; }
  .barra-fer input[type="search"] { width: 100%; }
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .quadro { grid-auto-columns: 82vw; scroll-snap-type: x mandatory; }
  .quadro .col { scroll-snap-align: start; }
  .linhas li { flex-wrap: wrap; } .linhas .acoes { width: 100%; }
  dialog { width: 100vw; max-width: 100vw; max-height: 100dvh; margin: 0; }
  .gv-rodape .perigo { margin-left: 0; }
  .topbar-in { padding-top: 8px; }
}
@supports (padding: max(0px)) { body { padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); } }

/* arrastar cartões no quadro */
.quadro .cartao { cursor: grab; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.cartao.arrastando { opacity: .3; }
.cartao.cartao-fantasma { position: fixed; z-index: 9999; margin: 0; pointer-events: none; cursor: grabbing; box-shadow: 0 14px 34px rgba(0,0,0,.55); transform: rotate(2deg); opacity: .96; }
.col { transition: background .12s, outline-color .12s; }
.col.alvo { outline: 2px dashed var(--accent); outline-offset: -2px; background: color-mix(in srgb, var(--accent) 10%, var(--surface-2)); }
body.arrastando-cartao { -webkit-user-select: none; user-select: none; cursor: grabbing; }
body.arrastando-cartao * { cursor: grabbing !important; }
@media (max-width: 640px) { body.arrastando-cartao .quadro { scroll-snap-type: none; } }

/* seleção em massa na lista do CRM */
.sel-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin: 0 0 10px; min-height: 32px; }
.tabela th.sel, .tabela td.sel { width: 34px; padding-right: 8px; cursor: pointer; }
.tabela td.sel input, .tabela th.sel input { accent-color: var(--accent); width: 17px; height: 17px; cursor: pointer; pointer-events: none; }

</style>

<script>
/* Agência BC · cálculos puros (sem DOM). Rodam no navegador e no Node (tests/). */
(function (root) {
  'use strict';

  // ───────────── constantes ─────────────
  var ETAPAS = [
    { id: 'novo', nome: 'A contatar' },
    { id: 'abordado', nome: 'Abordado' },
    { id: 'respondeu', nome: 'Respondeu' },
    { id: 'diagnostico', nome: 'Mini-diagnóstico' },
    { id: 'reuniao', nome: 'Reunião' },
    { id: 'proposta', nome: 'Proposta' },
    { id: 'fechado', nome: 'Fechado' },
    { id: 'perdido', nome: 'Perdido' }
  ];
  var ORDEM_FUNIL = ['novo', 'abordado', 'respondeu', 'diagnostico', 'reuniao', 'proposta', 'fechado'];

  // Pesquisa de relacionamento: 5 critérios, nota 1 a 5. A confiança pesa o dobro.
  var CRITERIOS = [
    { id: 'confianca', nome: 'Confiança e abertura', peso: 2,
      pergunta: 'O cliente ouve você como conselheiro ou só como quem executa pedidos?',
      ancoras: { 1: 'Desconfia e rebate tudo', 3: 'Confia no básico, hesita no resto', 5: 'Pede opinião e divide o contexto do negócio' } },
    { id: 'aderencia', nome: 'Aderência ao combinado', peso: 1,
      pergunta: 'Ele aplicou o que foi orientado no relatório da semana?',
      ancoras: { 1: 'Não aplicou nada', 3: 'Aplicou o essencial, com atraso', 5: 'Aplica tudo, rápido' } },
    { id: 'postura', nome: 'Postura diante de problemas', peso: 1,
      pergunta: 'Quando o resultado cai, ele encara junto ou procura culpado?',
      ancoras: { 1: 'Culpa a agência', 3: 'Escuta, mas reclama', 5: 'Assume a parte dele e age' } },
    { id: 'presenca', nome: 'Presença e resposta', peso: 1,
      pergunta: 'Ele responde e participa durante a semana?',
      ancoras: { 1: 'Some por dias', 3: 'Responde, com atrasos pontuais', 5: 'Ativo e rápido' } },
    { id: 'insumos', nome: 'Entrega de insumos', peso: 1,
      pergunta: 'Ele envia acessos, retorno dos leads e materiais pedidos?',
      ancoras: { 1: 'Não envia nada', 3: 'Envia o básico, fora do prazo', 5: 'Envia tudo, no prazo' } }
  ];

  // Sinais de desengajamento (antecipam churn). peso = pontos tirados do health score.
  var GATILHOS = [
    { id: 'sumiu', texto: 'Passou mais de 5 dias sem responder', curto: 'sumiu', peso: 10 },
    { id: 'cobranca', texto: 'Só responde com cobrança constante', curto: 'responde só com cobrança', peso: 7 },
    { id: 'reunioes', texto: 'Falta ou desmarca as reuniões combinadas', curto: 'falta a reuniões', peso: 7 },
    { id: 'nao_implementa', texto: 'Não implementa o que foi pedido', curto: 'não implementa', peso: 7 },
    { id: 'reduziu_verba', texto: 'Reduziu a verba ou o investimento', curto: 'reduziu a verba', peso: 10 },
    { id: 'nao_acessa', texto: 'Não abre o relatório nem o painel', curto: 'não abre o relatório', peso: 7 },
    { id: 'atraso_pagto', texto: 'Atrasa pagamentos com frequência', curto: 'atrasa pagamentos', peso: 10 },
    { id: 'desinteresse', texto: 'Perdeu o interesse em ideias novas', curto: 'sem interesse em ideias', peso: 7 },
    { id: 'frio', texto: 'Ficou seco: só trata de assunto objetivo', curto: 'relação fria', peso: 7 },
    { id: 'sem_vitoria', texto: 'Não comemora mais os resultados', curto: 'não comemora resultados', peso: 7 }
  ];

  // Motivos de saída em cascata: percorre de cima para baixo e para no primeiro que explica.
  var MOTIVOS_SAIDA = [
    { id: 'erro_critico', nome: 'Erro crítico', def: 'Falha grave de operação na campanha ou na entrega.' },
    { id: 'performance', nome: 'Performance', def: 'O serviço contratado não chegou a ser entregue.' },
    { id: 'alinhamento', nome: 'Falta de alinhamento', def: 'Foi entregue, mas o cliente não percebeu o valor.' },
    { id: 'estrutura', nome: 'Falta de estrutura interna', def: 'Entreguei, mas ele não tinha equipe ou atendimento para aproveitar.' },
    { id: 'perspectiva', nome: 'Falta de perspectiva', def: 'Serviço e relação bons, mas sem visão de futuro; trocou por uma promessa maior.' },
    { id: 'relacionamento', nome: 'Relacionamento', def: 'A relação se rompeu por conflito ou desrespeito.' },
    { id: 'troca_gestor', nome: 'Troca de gestor', def: 'O gestor mudou e o vínculo não continuou.' },
    { id: 'saida_contato', nome: 'Saída do contato', def: 'Quem contratou deixou a empresa.' },
    { id: 'escopo', nome: 'Escopo', def: 'Precisou de algo que não ofereço e buscou fora.' },
    { id: 'negocio', nome: 'Negócio', def: 'Uma decisão dele sobre a empresa tornou o trabalho inviável.' }
  ];

  var PROB_RENOVACAO_PADRAO = { verde: 0.85, amarelo: 0.6, vermelho: 0.3 };
  var PROB_ETAPA_PADRAO = { abordado: 0.02, respondeu: 0.06, diagnostico: 0.12, reuniao: 0.25, proposta: 0.45 };

  // ───────────── datas (sempre texto AAAA-MM-DD, fuso local) ─────────────
  var DIA = 86400000;
  function pad(n) { return String(n).padStart(2, '0'); }
  function toISO(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseISO(s) { var p = String(s).slice(0, 10).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  var _hoje = null;
  function hoje() { return _hoje || toISO(new Date()); }
  function setHoje(iso) { _hoje = iso; }
  function addDias(iso, n) { var d = parseISO(iso); d.setDate(d.getDate() + n); return toISO(d); }
  function addMeses(iso, n) {
    var d = parseISO(iso), dia = d.getDate();
    d.setDate(1); d.setMonth(d.getMonth() + n);
    var ult = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    d.setDate(Math.min(dia, ult));
    return toISO(d);
  }
  function diffDias(a, b) { return Math.round((parseISO(b) - parseISO(a)) / DIA); } // b - a
  function inicioSemana(iso) { var d = parseISO(iso); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return toISO(d); }
  function mesDe(iso) { return String(iso).slice(0, 7); }
  function primeiroDiaMes(iso) { return mesDe(iso) + '-01'; }
  function ultimoDiaMes(iso) { var d = parseISO(iso); return toISO(new Date(d.getFullYear(), d.getMonth() + 1, 0)); }
  function addMesesMes(iso, n) { return mesDe(addMeses(primeiroDiaMes(iso), n)); }
  function diaUtil(iso) { var w = parseISO(iso).getDay(); return w !== 0 && w !== 6; }
  function dataLocalDe(ts) { return toISO(new Date(ts)); }
  function r1(n) { return Math.round(n * 10) / 10; }
  function soma(arr, f) { return arr.reduce(function (s, x) { return s + (Number(f(x)) || 0); }, 0); }

  // ───────────── cliente: tempo de casa, valor, contrato, curva ─────────────
  function fimVida(c, h) { return (c.status === 'churn' && c.churn_data) ? c.churn_data : h; }
  function ltMeses(c, h) { h = h || hoje(); return Math.max(0, diffDias(c.inicio, fimVida(c, h))) / 30.4375; }
  function ltv(c, h) { return ltMeses(c, h) * (Number(c.mensalidade) || 0); }
  function fimContrato(c) { return addMeses(c.inicio, Number(c.duracao_meses) || 0); }
  function diasParaFim(c, h) { return diffDias(h || hoje(), fimContrato(c)); }

  // Curva por percentil de mensalidade entre os ativos: A = 20% de cima, B = próximos 30%, C = resto.
  function curvaABC(ativos) {
    var ord = ativos.slice().sort(function (a, b) {
      return (Number(b.mensalidade) - Number(a.mensalidade)) || String(a.nome).localeCompare(String(b.nome));
    });
    var n = ord.length, out = {}, ultimoValor = null, ultimoPos = 0;
    ord.forEach(function (c, i) {
      var v = Number(c.mensalidade);
      if (v !== ultimoValor) { ultimoValor = v; ultimoPos = i; }   // empates dividem a mesma curva
      var p = ultimoPos / n;
      out[c.id] = p < 0.2 ? 'A' : (p < 0.5 ? 'B' : 'C');
    });
    return out;
  }

  // ───────────── relacionamento ─────────────
  function notaRelacionamento(r) {
    var s = 0, pesos = 0;
    for (var i = 0; i < CRITERIOS.length; i++) {
      var c = CRITERIOS[i], v = Number(r[c.id]);
      if (!(v >= 1 && v <= 5)) return null;
      s += v * c.peso; pesos += c.peso;
    }
    return r1(s / pesos * 2);
  }
  function faixaRelacionamento(n) { return n >= 9 ? 'otimo' : (n >= 7 ? 'regular' : 'ruim'); }

  BC.fechar = function (el) { var d = el.closest('dialog'); if (d) d.close(); };
  BC.cabDialogo = function (titulo, sub) {

  // ───────────── dica (tooltip) dos gráficos ─────────────
  var dica = null;

    dica.textContent = alvo.getAttribute('data-dica'); dica.hidden = false;

  document.addEventListener('click', function (e) {

  // ───────────── gráficos (SVG sem biblioteca) ─────────────
  function maxBonito(v) {

  function barraArredondada(x, y, w, h, r) {   // cantos arredondados só no topo
    r = Math.min(r, w / 2, h);
    if (h <= 0) return '';
    return 'M' + x + ',' + (y + h) + 'V' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y + 'H' + (x + w - r) + 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + 'V' + (y + h) + 'Z';
  }
  BC.graf = {
    // barras simples (ex.: leads por semana), com linha de meta opcional
    barras: function (valores, rotulos, opts) {
      opts = opts || {};

      var pw = W - pe - pd, ph = H - pt - pb, passo = pw / n, bw = Math.min(26, passo * 0.62);
      var s = '<svg class="graf" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + BC.esc(opts.titulo || 'Gráfico de barras') + '">';
      [0, topo / 2, topo].forEach(function (t) {
        var y = pt + ph - (t / topo) * ph;
        s += '<line class="grade" x1="' + pe + '" x2="' + (W - pd) + '" y1="' + y + '" y2="' + y + '"/><text x="' + (pe - 5) + '" y="' + (y + 3.5) + '" text-anchor="end">' + Math.round(t) + '</text>';
      });
      valores.forEach(function (v, i) {
        var h = (v / topo) * ph, x = pe + passo * i + (passo - bw) / 2, y = pt + ph - h;
        var ultimo = i === n - 1;
        s += '<path d="' + barraArredondada(x, y, bw, h, 3) + '" fill="var(--accent)" opacity="' + (ultimo ? 1 : 0.55) + '"/>';
        s += '<rect x="' + (pe + passo * i) + '" y="' + pt + '" width="' + passo + '" height="' + (ph + pb - 4) + '" fill="transparent" data-dica="' + BC.esc(rotulos[i] + ': ' + v + (opts.unid || '')) + '"/>';
        if (ultimo) s += '<text x="' + (x + bw / 2) + '" y="' + (y - 4) + '" text-anchor="middle" style="fill:var(--ink);font-weight:600">' + v + '</text>';
        if (i === 0 || ultimo || n <= 6) s += '<text x="' + (x + bw / 2) + '" y="' + (H - 5) + '" text-anchor="middle">' + BC.esc(rotulos[i]) + '</text>';
      });
      if (opts.meta) {
        var ym = pt + ph - (opts.meta / topo) * ph;
        s += '<line x1="' + pe + '" x2="' + (W - pd) + '" y1="' + ym + '" y2="' + ym + '" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 3"/>';
        s += '<text x="' + (W - pd) + '" y="' + (ym - 4) + '" text-anchor="end" style="fill:var(--ink)">meta ' + opts.meta + '</text>';
      }

    },
    // linha de nota 0–10 com as faixas de 7 e 9
    notas: function (valores, rotulos) {
      var W = 340, H = 130, pe = 24, pd = 10, pt = 12, pb = 20, n = valores.length;
      if (!n) return '<p class="vazio">Sem notas de relacionamento ainda.</p>';
      var pw = W - pe - pd, ph = H - pt - pb;
      function X(i) { return n === 1 ? pe + pw / 2 : pe + (pw * i) / (n - 1); }
      function Y(v) { return pt + ph - (v / 10) * ph; }
      var s = '<svg class="graf" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Nota de relacionamento por semana">';
      [0, 5, 10].forEach(function (t) { s += '<line class="grade" x1="' + pe + '" x2="' + (W - pd) + '" y1="' + Y(t) + '" y2="' + Y(t) + '"/><text x="' + (pe - 5) + '" y="' + (Y(t) + 3.5) + '" text-anchor="end">' + t + '</text>'; });
      [7, 9].forEach(function (t) { s += '<line x1="' + pe + '" x2="' + (W - pd) + '" y1="' + Y(t) + '" y2="' + Y(t) + '" stroke="var(--ink-3)" stroke-dasharray="3 3"/><text x="' + (W - pd) + '" y="' + (Y(t) - 3) + '" text-anchor="end">' + t + '</text>'; });
      var pts = valores.map(function (v, i) { return X(i) + ',' + Y(v); }).join(' ');
      s += '<polyline points="' + pts + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
      valores.forEach(function (v, i) {
        var ult = i === n - 1;
        s += '<circle cx="' + X(i) + '" cy="' + Y(v) + '" r="' + (ult ? 5 : 3.5) + '" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>';
        s += '<circle cx="' + X(i) + '" cy="' + Y(v) + '" r="14" fill="transparent" data-dica="' + BC.esc(rotulos[i] + ': ' + BC.n1(v)) + '"/>';
        if (ult) s += '<text x="' + X(i) + '" y="' + (Y(v) - 9) + '" text-anchor="end" style="fill:var(--ink);font-weight:600">' + BC.n1(v) + '</text>';
        if (i === 0 || ult) s += '<text x="' + X(i) + '" y="' + (H - 5) + '" text-anchor="' + (i === 0 ? 'start' : 'end') + '">' + BC.esc(rotulos[i]) + '</text>';
      });
      return s + '</svg>';
    },
    // MRR: histórico (barras neutras), contratado (barras azuis) e esperado (linha com pontos)
    mrr: function (hist, prev) {
      var W = 640, H = 250, pe = 54, pd = 10, pt = 16, pb = 26;
      var meses = hist.map(function (x) { return { mes: x.mes, tipo: 'hist', mrr: x.mrr }; })
        .concat(prev.slice(1).map(function (x) { return { mes: x.mes, tipo: 'prev', contratado: x.contratado, esperado: x.esperado }; }));
      var maxV = Math.max.apply(null, meses.map(function (m) { return Math.max(m.mrr || 0, m.contratado || 0, m.esperado || 0); }).concat([1]));
      var topo = maxBonito(maxV * 1.05), pw = W - pe - pd, ph = H - pt - pb, n = meses.length, passo = pw / n, bw = Math.min(34, passo * 0.56);
      function Y(v) { return pt + ph - (v / topo) * ph; }
      var s = '<svg class="graf" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="MRR histórico e previsão para os próximos meses">';
      [0, 0.25, 0.5, 0.75, 1].forEach(function (f) {
        var v = topo * f;
        s += '<line class="grade" x1="' + pe + '" x2="' + (W - pd) + '" y1="' + Y(v) + '" y2="' + Y(v) + '"/><text x="' + (pe - 6) + '" y="' + (Y(v) + 3.5) + '" text-anchor="end">' + (v >= 1000 ? (Math.round(v / 100) / 10).toString().replace('.', ',') + ' mil' : Math.round(v)) + '</text>';
      });
      var linha = [];
      meses.forEach(function (m, i) {
        var cx = pe + passo * i + passo / 2, x = cx - bw / 2;
        var valor = m.tipo === 'hist' ? m.mrr : m.contratado;
        var cor = m.tipo === 'hist' ? 'var(--ink-3)' : 'var(--accent)';
        var tip = m.tipo === 'hist' ? BC.mes(m.mes) + ': ' + BC.brl(m.mrr) : BC.mes(m.mes) + ' · contratado ' + BC.brl(m.contratado) + ' · esperado ' + BC.brl(m.esperado);
        s += '<path d="' + barraArredondada(x, Y(valor), bw, (valor / topo) * ph, 4) + '" fill="' + cor + '"/>';
        if (m.tipo === 'prev') linha.push({ cx: cx, y: Y(m.esperado), m: m });
        s += '<rect x="' + (cx - passo / 2) + '" y="' + pt + '" width="' + passo + '" height="' + (ph + pb - 6) + '" fill="transparent" data-dica="' + BC.esc(tip) + '"/>';
        s += '<text x="' + cx + '" y="' + (H - 7) + '" text-anchor="middle">' + BC.mes(m.mes) + '</text>';
      });
      if (linha.length) {
        s += '<polyline points="' + linha.map(function (p) { return p.cx + ',' + p.y; }).join(' ') + '" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>';
        linha.forEach(function (p, i) {
          s += '<circle cx="' + p.cx + '" cy="' + p.y + '" r="4.5" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"/>';
          if (i === linha.length - 1) s += '<text x="' + p.cx + '" y="' + (p.y - 9) + '" text-anchor="end" style="fill:var(--ink);font-weight:600">' + BC.brl(p.m.esperado) + '</text>';
        });
      }
      return s + '</svg>' +
        '<div class="legenda"><span><i style="background:var(--ink-3)"></i>Histórico (MRR do mês)</span><span><i style="background:var(--accent)"></i>Contratado (contratos vigentes)</span><span><i style="background:var(--ink);border-radius:50%"></i>Esperado (com renovações prováveis)</span></div>';
    }
  };
})(window);

<script>
/* Agência BC · diálogos da carteira: cliente, check-in semanal, feedback, churn. */
(function (root) {
  'use strict';

  }

  // ───────────── cliente ─────────────
  BC.abrirCliente = function (cliente, pre) {

      BC.cabDialogo(c.id ? 'Editar cliente' : 'Novo cliente', c.id ? '' : 'Só o essencial para a conta. O resto você completa depois.') +
      '<div class="grade">' +
      campo('cli-nome', 'Nome do cliente', inp('cli-nome', 'text', v('nome'), 'required autocomplete="off"'), { largo: true }) +
      campo('cli-segmento', 'Segmento', inp('cli-segmento', 'text', v('segmento'), 'placeholder="Ex.: estética, imobiliária"')) +
      campo('cli-contato_nome', 'Quem decide no cliente', inp('cli-contato_nome', 'text', v('contato_nome'))) +
      campo('cli-whatsapp', 'WhatsApp', inp('cli-whatsapp', 'text', v('whatsapp'), 'inputmode="tel"')) +
      campo('cli-instagram', 'Instagram (sem @)', inp('cli-instagram', 'text', v('instagram'))) +
      campo('cli-mensalidade', 'Mensalidade (R$)', inp('cli-mensalidade', 'number', v('mensalidade'), 'required min="0" step="any" inputmode="decimal"'), { dica: 'Valor da sua gestão, sem a verba dos anúncios.' }) +

      campo('cli-duracao_meses', 'Duração (meses)', '<select id="cli-duracao_meses" name="duracao_meses">' + opcoes(durs.map(function (d) { return [d, d + ' meses']; }), dAtual) + '</select>') +
      campo('cli-verba_mensal', 'Verba mensal de anúncios (R$)', inp('cli-verba_mensal', 'number', v('verba_mensal'), 'min="0" step="any" inputmode="decimal"'), { dica: 'Paga pelo cliente direto à plataforma.' }) +
      campo('cli-meta_leads_semana', 'Meta de leads por semana', inp('cli-meta_leads_semana', 'number', v('meta_leads_semana'), 'min="0" step="1" inputmode="numeric"'), { dica: 'Usada no health score.' }) +
      campo('cli-meta_cpl', 'CPL máximo aceitável (R$)', inp('cli-meta_cpl', 'number', v('meta_cpl'), 'min="0" step="any" inputmode="decimal"')) +
      campo('cli-notas', 'Notas', '<textarea id="cli-notas" name="notas">' + esc(v('notas')) + '</textarea>', { largo: true }) +

    var d = BC.dados(form);
    var cp = C.cpl(BC.num(d.investimento), BC.num(d.leads));
    form.querySelector('[data-out=cpl]').textContent = cp == null ? '—' : BC.brl2(cp);
    var nota = C.notaRelacionamento({ confianca: d.r_confianca, aderencia: d.r_aderencia, postura: d.r_postura, presenca: d.r_presenca, insumos: d.r_insumos });

      out.innerHTML = '<span class="muted small">Responda os cinco critérios para ver a nota.</span>';

    var respondidos = Object.keys(rel).filter(function (k) { return rel[k] != null && rel[k] !== ''; }).length;
    if (respondidos > 0 && respondidos < 5) return BC.erroForm(form, 'Responda os cinco critérios de relacionamento ou deixe todos em branco.');
    var nota = respondidos === 5 ? C.notaRelacionamento(rel) : null;

  // ───────────── feedback ─────────────

    BC.dialogo(html);

  BC.act['novo-feedback'] = function (el) { BC.abrirFeedback(el.dataset.id); };

  BC.abrirChurn = function (clienteId) {

      BC.cabDialogo('Registrar churn', cli.nome) +

      '<div class="campo"><span class="rotulo">Motivo da saída</span><p class="small muted">Percorra a lista de cima para baixo e pare no primeiro motivo que explica a saída.</p>' +

      '<div class="dlg-rodape"><button type="button" class="btn" data-act="fechar">Cancelar</button><button type="submit" class="btn perigo">Registrar churn</button></div></form>';
    BC.dialogo(html);
  };
  BC.act['churn'] = function (el) { BC.abrirChurn(el.dataset.id); };
  BC.forms.churn = function (form) {
    var d = BC.dados(form);
    if (!d.motivo) return BC.erroForm(form, 'Escolha o motivo da saída.');
    if (!BC.txt(d.aprendizados)) return BC.erroForm(form, 'Escreva o que você faria diferente.');
    BC.seguro(async function () {
      await S.update('clientes', form.dataset.id, { status: 'churn', churn_data: d.data, churn_motivo: d.motivo, churn_aprendizados: BC.txt(d.aprendizados) });
      BC.fechar(form); BC.toast('Churn registrado.');
      location.hash = '#churn';
    }, form);
  };
  BC.act['reverter-churn'] = function (el) {
    BC.seguro(async function () {
      await S.update('clientes', el.dataset.id, { status: 'ativo', churn_data: null, churn_motivo: null, churn_aprendizados: null });

      location.hash = '#c-' + el.dataset.id;
    });
  };
})(window);

<script>

(function (root) {

  function idx(etapa) { return C.ORDEM_FUNIL.indexOf(etapa); }
  function maiorEtapa(atual, nova) { return idx(nova) > idx(atual) ? nova : (idx(atual) < 0 ? nova : atual); }

  // ───────────── contato: gaveta lateral com os dados editáveis ─────────────

    var ativ = S.all('atividades').filter(function (a) { return a.prospect_id === id; }).sort(function (a, b) { return a.created_at < b.created_at ? 1 : -1; }).slice(0, 12);
    var tipos = { toque: 'Toque', resposta: 'Resposta', etapa: 'Etapa', nota: 'Nota' };

    var prox = C.ORDEM_FUNIL[idx(p.etapa) + 1];

    var html = '<form class="dlg gv" data-form="prospect" data-id="' + esc(id) + '">' +

      campo('pr-negocio', 'Negócio / nicho', '<input id="pr-negocio" name="negocio" type="text" value="' + esc(p.negocio || '') + '">') +
      campo('pr-telefone', 'Telefone / WhatsApp', '<input id="pr-telefone" name="telefone" type="tel" inputmode="tel" value="' + esc(p.telefone || '') + '">') +
      campo('pr-email', 'E-mail', '<input id="pr-email" name="email" type="email" value="' + esc(p.email || '') + '">') +
      campo('pr-instagram', '@ do Instagram', '<input id="pr-instagram" name="instagram" type="text" value="' + esc(p.instagram ? '@' + p.instagram : '') + '">') +
      campo('pr-cidade', 'Cidade', '<input id="pr-cidade" name="cidade" type="text" value="' + esc(p.cidade || '') + '">') +
      campo('pr-estado', 'Estado (UF)', '<input id="pr-estado" name="estado" type="text" maxlength="2" style="text-transform:uppercase" placeholder="Ex.: RR" value="' + esc(p.estado || '') + '">') +
      campo('pr-canal', 'Canal', '<select id="pr-canal" name="canal">' + opcoes(CANAIS, p.canal) + '</select>') +
      campo('pr-etapa', 'Etapa', '<select id="pr-etapa" name="etapa">' + opcoes(C.ETAPAS.map(function (e) { return [e.id, e.nome]; }), p.etapa) + '</select>') +
      campo('pr-proxima_data', 'Próxima etapa', '<input id="pr-proxima_data" name="proxima_data" type="date" value="' + esc(p.proxima_data || '') + '">') +
      campo('pr-proxima_acao', 'O que fazer na próxima etapa', '<input id="pr-proxima_acao" name="proxima_acao" type="text" value="' + esc(p.proxima_acao || '') + '" placeholder="Ex.: Follow-up 1">') +
      campo('pr-notas', 'Anotações da conversa', '<textarea id="pr-notas" name="notas" placeholder="O que ele falou, o que ficou combinado, quando retomar...">' + esc(p.notas || '') + '</textarea>') +
      campo('pr-abordagem', 'Mensagem de abordagem', '<textarea id="pr-abordagem" name="abordagem" placeholder="A mensagem que você vai enviar neste primeiro contato.">' + esc(p.abordagem || '') + '</textarea>') +
      campo('pr-diagnostico', 'Mini-diagnóstico (entregável)', '<textarea id="pr-diagnostico" name="diagnostico" placeholder="Resumo ou link do mini-diagnóstico, pronto para enviar se ele responder.">' + esc(p.diagnostico || '') + '</textarea>') +
      (p.etapa === 'perdido' ? campo('pr-motivo_perda', 'Motivo da perda', '<input id="pr-motivo_perda" name="motivo_perda" type="text" value="' + esc(p.motivo_perda || '') + '">') : '') +
      '<div class="gv-links">' + BC.iconesContato(p) + '</div>' +
      '<details class="gv-mais"><summary>Mais detalhes</summary><div class="gv-mais-corpo">' +
      campo('pr-nicho', 'Nicho', '<input id="pr-nicho" name="nicho" type="text" value="' + esc(p.nicho || '') + '">') +
      campo('pr-origem', 'Origem', '<select id="pr-origem" name="origem">' + opcoes(ORIGENS, p.origem) + '</select>') +
      campo('pr-campanha', 'Campanha / formulário', '<input id="pr-campanha" name="campanha" type="text" value="' + esc(p.campanha || '') + '">') +
      campo('pr-lista_id', 'Lista', '<select id="pr-lista_id" name="lista_id"><option value="">Sem lista</option>' + opcoes(listas.map(function (l) { return [l.id, l.nome]; }), p.lista_id || '') + '</select>') +
      '</div></details>' +
      '<div class="gv-acoes"><button type="button" class="btn mini primario" data-act="toque" data-id="' + esc(id) + '">Registrar toque</button>' +
      (p.etapa === 'abordado' || p.etapa === 'novo' ? '<button type="button" class="btn mini" data-act="respondeu" data-id="' + esc(id) + '">Respondeu</button>' : '') +
      (p.cliente_id ? '<a class="btn mini" href="#c-' + esc(p.cliente_id) + '" data-act="fechar-e-ir">Ver cliente</a>' : (p.etapa !== 'fechado' ? '<button type="button" class="btn mini" data-act="converter" data-id="' + esc(id) + '">Converter em cliente</button>' : '')) +
      (p.etapa !== 'perdido' && p.etapa !== 'fechado' ? '<button type="button" class="btn mini fantasma" data-act="perdido" data-id="' + esc(id) + '">Marcar como perdido</button>' : '') + '</div>' +
      '<div class="gv-hist"><h2>Histórico</h2>' + (ativ.length ? '<ul class="linhas">' + ativ.map(function (a) {
        var d = new Date(a.created_at);
        return '<li><div class="corpo"><div class="small"><span class="tag">' + (tipos[a.tipo] || a.tipo) + '</span> ' + BC.dataCurta(C.toISO(d)) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + (a.canal ? ' · ' + esc(a.canal) : '') + '</div>' + (a.texto ? '<div class="det">' + esc(a.texto) + '</div>' : '') + '</div></li>';
      }).join('') + '</ul>' : '<p class="small faint">Nenhum toque registrado ainda.</p>') + '</div>' +
      '<p class="small faint gv-meta">Cadastrado em ' + cad + ' · etapa atual: <strong>' + esc(BC.nomeEtapa(p.etapa)) + '</strong>' + (p.proxima_data ? ' · próxima etapa em ' + BC.dataCurta(p.proxima_data) : '') + '</p>' +

      (prox ? '<button type="button" class="btn" data-act="avancar" data-id="' + esc(id) + '">Avançar etapa</button>' : '') +

    BC.dialogo(html, { gaveta: true, semFoco: true });
  };
  BC.act['abrir-prospect'] = function (el) { BC.abrirProspect(el.dataset.id); };

  BC.forms.prospect = function (form) {
    var d = BC.dados(form), id = form.dataset.id;

        if (antigo.etapa !== row.etapa) await S.insert('atividades', { prospect_id: id, tipo: 'etapa', canal: '', texto: 'De ' + BC.nomeEtapa(antigo.etapa) + ' para ' + BC.nomeEtapa(row.etapa) });
      } else {

        await S.insert('prospects', row);

  // ───────────── toque ─────────────
  BC.abrirToque = function (id) {
