    out += '</section>';

    // check-ins pendentes
    out += '<section class="bloco"><div class="bloco-cab"><h2>Check-in da semana</h2><span class="small muted">' + feitos.length + ' de ' + x.ativos.length + ' feitos</span></div>';
    out += '<div class="progresso' + (pend.length ? '' : ' ok') + '" style="margin-bottom:6px" role="progressbar" aria-valuenow="' + feitos.length + '" aria-valuemax="' + x.ativos.length + '"><i style="width:' + (x.ativos.length ? feitos.length / x.ativos.length * 100 : 0) + '%"></i></div>';
    if (!pend.length) out += '<p class="vazio">Todos os check-ins da semana estão feitos.</p>';
    else out += '<ul class="linhas">' + pend.map(function (c) {
      var u = checkinsDe(x, c.id)[0];
      return '<li><div class="corpo">' + linkCli(c) + '<div class="det">' + (u ? 'Último check-in: semana de ' + BC.dataCurta(u.semana) : 'Ainda sem check-in') + '</div></div>' +
        '<div class="acoes"><button class="btn mini primario" data-act="checkin" data-id="' + esc(c.id) + '">Fazer check-in</button></div></li>';
    }).join('') + '</ul>';
    out += '</section>';

    // prospecção hoje
    out += '<section class="bloco"><div class="bloco-cab"><h2>CRM hoje</h2><a href="#prospeccao" class="small">Abrir CRM</a></div>' +
      '<div class="resumo-pros" style="margin-bottom:10px"><div class="item"><div class="rot">Toques hoje</div><div class="val">' + sq.hoje + '<span class="faint" style="font-size:16px"> / ' + meta + '</span></div></div>' +
      '<div class="item"><div class="rot">Sequência</div><div class="val">' + sq.streak + '<span class="faint" style="font-size:16px"> ' + (sq.streak === 1 ? 'dia útil' : 'dias úteis') + '</span></div></div></div>' +
      '<div class="progresso' + (sq.hoje >= meta ? ' ok' : '') + '" style="margin-bottom:10px"><i style="width:' + Math.min(100, sq.hoje / meta * 100) + '%"></i></div>' +
      '<ul class="linhas"><li><div class="corpo">Follow-ups para hoje ou atrasados</div><div class="num">' + devidos.length + '</div></li>' +
      '<li><div class="corpo">Leads novos do tráfego pago</div><div class="num">' + leadsNovos.length + '</div></li>' +
      '<li><div class="corpo">Contatos em andamento</div><div class="num">' + abertos.filter(function (p) { return p.etapa !== 'novo'; }).length + '</div></li></ul></section>';

    // renovações
    out += '<section class="bloco"><div class="bloco-cab"><h2>Contratos a renovar (60 dias)</h2></div>';
    if (!renov.length) out += '<p class="vazio">Nenhum contrato termina nos próximos 60 dias.</p>';
    else out += '<ul class="linhas">' + renov.map(function (c) {
      var d = C.diasParaFim(c, h), s = x.saude[c.id];
      return '<li><div class="corpo">' + linkCli(c) + ' ' + BC.pillFarol(s.farol) + '<div class="det">' + (d < 0 ? 'Venceu ' + BC.rotuloDias(d) : 'Termina ' + BC.rotuloDias(d)) + ' (' + BC.data(C.fimContrato(c)) + ') · ' + BC.brl(c.mensalidade) + '/mês</div></div>' +
        '<div class="acoes"><button class="btn mini" data-act="novo-feedback" data-id="' + esc(c.id) + '">+ Feedback</button></div></li>';
    }).join('') + '</ul>';
    out += '</section></div>';
    return out;
  };

  // ───────────── clientes ─────────────
  BC.views.clientes = function () {
    var x = BC.ctx(), h = x.h, ui = BC.ui;
    var lista = x.ativos.slice().sort(function (a, b) { return x.saude[a.id].score - x.saude[b.id].score || String(a.nome).localeCompare(String(b.nome)); });
    if (ui.filtroRisco) lista = lista.filter(function (c) { return x.saude[c.id].farol !== 'verde'; });
    var mrr = soma(x.ativos, function (c) { return c.mensalidade; });

    var out = '<div class="pagehead"><div><h1>Clientes</h1><p class="sub">' + x.ativos.length + ' ativos · MRR ' + BC.brl(mrr) + '</p></div>' +
      '<div class="pagehead-acoes"><button class="btn' + (ui.filtroRisco ? ' primario' : '') + '" data-act="toggle-risco" aria-pressed="' + ui.filtroRisco + '">Só em atenção</button>' +
      '<button class="btn primario" data-act="novo-cliente">+ Cliente</button></div></div>' + bannerExemplos();
    if (!x.ativos.length) return out + '<p class="vazio">Nenhum cliente ativo. Use “+ Cliente” para cadastrar o primeiro.</p>';
    out += '<div class="rolagem"><table class="tabela"><thead><tr><th>Cliente</th><th>Curva</th><th class="num">Mensalidade</th><th class="num hide-s">LT</th><th class="num hide-s">LTV</th>' +
      '<th class="num hide-s">Leads / meta</th><th>Relacionamento</th><th>Farol</th><th class="hide-s">Contrato até</th><th></th></tr></thead><tbody>';
    lista.forEach(function (c) {
      var s = x.saude[c.id], u = checkinsDe(x, c.id)[0], rel = checkinsDe(x, c.id).filter(function (k) { return k.nota_rel != null; })[0];
      out += '<tr class="clicavel" data-act="abrir-cliente" data-id="' + esc(c.id) + '">' +
        '<td><div class="nome">' + esc(c.nome) + '</div><div class="small faint">' + esc(c.segmento || '') + (s.novo90 ? ' · <span class="tag acc">primeiros 90 dias</span>' : '') + '</div></td>' +
        '<td><span class="curva ' + x.curva[c.id] + '" title="Curva por percentil de mensalidade">' + x.curva[c.id] + '</span></td>' +
        '<td class="num">' + BC.brl(c.mensalidade) + '</td>' +
        '<td class="num hide-s">' + BC.n1(C.ltMeses(c, h)) + ' m</td>' +
        '<td class="num hide-s">' + BC.brl(C.ltv(c, h)) + '</td>' +
        '<td class="num hide-s">' + (u && u.leads != null ? u.leads + (c.meta_leads_semana ? ' / ' + c.meta_leads_semana : '') : '—') + '</td>' +
        '<td>' + BC.pillRel(rel ? rel.nota_rel : null) + '</td>' +
        '<td>' + BC.pillFarol(s.farol, s.score) + '</td>' +
        '<td class="hide-s nowrap">' + BC.data(C.fimContrato(c)) + (s.renovacao ? ' <span class="tag acc">renovar</span>' : '') + '</td>' +
        '<td><button class="btn mini" data-act="checkin" data-id="' + esc(c.id) + '">Check-in</button></td></tr>';
    });
    out += '</tbody><tfoot><tr><td colspan="2">Total</td><td class="num">' + BC.brl(mrr) + '</td><td class="hide-s"></td><td class="num hide-s">' + BC.brl(soma(x.ativos, function (c) { return C.ltv(c, h); })) + '</td><td colspan="5" class="hide-s"></td></tr></tfoot></table></div>';
    if (!lista.length) out += '<p class="vazio">Nenhum cliente em atenção. Bom sinal.</p>';
    out += '<p class="small faint" style="margin-top:12px">LT = meses desde o início. LTV = LT × mensalidade. Curva A/B/C por percentil de mensalidade entre os ativos (A = 20% maiores, B = próximos 30%, C = restante). O farol vem do health score de 0 a 100: verde a partir de 75, amarelo a partir de 50.</p>';
    return out;
  };
  BC.act['toggle-risco'] = function () { BC.ui.filtroRisco = !BC.ui.filtroRisco; BC.render(); };
  BC.act['abrir-cliente'] = function (el) { location.hash = '#c-' + el.dataset.id; };

  // ───────────── ficha do cliente ─────────────
  BC.views.cliente = function (id) {
    var c = S.get('clientes', id);
    if (!c) return '<p class="vazio">Cliente não encontrado. <a href="#clientes">Voltar para a carteira</a>.</p>';
    var x = BC.ctx(), h = x.h, perdido = c.status === 'churn';
    var cks = checkinsDe(x, id), asc = cks.slice().reverse().slice(-10);
    var fbs = x.feedbacks.filter(function (f) { return f.cliente_id === id; }).sort(function (a, b) { return a.data < b.data ? 1 : (a.data > b.data ? -1 : 0); });
    var s = perdido ? null : x.saude[id];

    var out = '<a class="voltar" href="#' + (perdido ? 'churn' : 'clientes') + '">← ' + (perdido ? 'Churn' : 'Clientes') + '</a>';
    out += '<div class="cli-cab"><div style="min-width:0"><h1>' + esc(c.nome) + '</h1>' +
      '<p class="sub muted" style="margin-top:6px">' + esc([c.segmento, c.contato_nome].filter(Boolean).join(' · ')) +
      (c.whatsapp && BC.waLink(c.whatsapp) ? ' · <a href="' + esc(BC.waLink(c.whatsapp)) + '" target="_blank" rel="noopener">WhatsApp</a>' : '') +
      (c.instagram ? ' · <a href="' + esc(BC.igLink(c.instagram)) + '" target="_blank" rel="noopener">@' + esc(c.instagram) + '</a>' : '') + '</p>';
    if (s) {
      out += '<div style="margin-top:10px">' + BC.pillFarol(s.farol, s.score) + (s.renovacao ? ' <span class="tag acc">renovação em ' + (s.diasFim < 0 ? 'atraso' : s.diasFim + ' dias') + '</span>' : '') + (s.novo90 ? ' <span class="tag acc">primeiros 90 dias</span>' : '') + '</div>';
      out += s.motivos.length ? '<ul class="motivos">' + s.motivos.map(function (m) { return '<li>− ' + esc(m.texto) + '</li>'; }).join('') + '</ul>' : '<p class="small muted" style="margin-top:8px">Sem alertas no momento.</p>';
    }
    out += '</div><div class="pagehead-acoes">';
    if (!perdido) out += '<button class="btn primario" data-act="checkin" data-id="' + esc(id) + '">Check-in</button><button class="btn" data-act="novo-feedback" data-id="' + esc(id) + '">+ Feedback</button>';
    out += '<button class="btn" data-act="editar-cliente" data-id="' + esc(id) + '">Editar</button>';
    out += perdido ? '<button class="btn" data-act="reverter-churn" data-id="' + esc(id) + '">Reverter churn</button>' : '<button class="btn perigo" data-act="churn" data-id="' + esc(id) + '">Dar churn</button>';
    out += '</div></div>';

    if (perdido) {
      out += '<div class="aviso warn" style="flex-direction:column;align-items:flex-start"><div><strong>Cliente perdido em ' + BC.data(c.churn_data) + '.</strong> Motivo: ' + esc(BC.nomeMotivo(c.churn_motivo)) + '.</div>' +
        (c.churn_aprendizados ? '<div class="small"><strong>O que eu faria diferente:</strong> ' + esc(c.churn_aprendizados) + '</div>' : '') + '</div>';
    }
    out += '<div class="faixa">' +
      '<div><div class="rot">Mensalidade</div><div class="val">' + BC.brl(c.mensalidade) + '</div>' + (perdido ? '' : '<div class="nota">curva ' + x.curva[id] + '</div>') + '</div>' +
      '<div><div class="rot">LT</div><div class="val">' + BC.n1(C.ltMeses(c, h)) + '<span class="faint" style="font-size:16px"> meses</span></div><div class="nota">desde ' + BC.data(c.inicio) + '</div></div>' +
      '<div><div class="rot">LTV</div><div class="val">' + BC.brl(C.ltv(c, h)) + '</div>' + (perdido ? '<div class="nota">congelado na saída</div>' : '') + '</div>' +
      '<div><div class="rot">Contrato</div><div class="val" style="font-size:20px">' + BC.data(C.fimContrato(c)) + '</div><div class="nota">' + (Number(c.duracao_meses) || '—') + ' meses' + (perdido ? '' : ' · ' + BC.rotuloDias(C.diasParaFim(c, h))) + '</div></div>' +
      '<div><div class="rot">Verba de anúncios</div><div class="val" style="font-size:20px">' + BC.brl(c.verba_mensal) + '</div><div class="nota">por mês, paga pelo cliente</div></div></div>';

    var leadsAsc = asc.filter(function (k) { return k.leads != null; });
    var relAsc = asc.filter(function (k) { return k.nota_rel != null; });
    out += '<div class="graficos"><div><div class="graf-tit"><span>Leads por semana</span><span class="faint">' + (c.meta_leads_semana ? 'meta ' + c.meta_leads_semana : 'sem meta definida') + '</span></div>' +
      BC.graf.barras(leadsAsc.map(function (k) { return Number(k.leads); }), leadsAsc.map(function (k) { return BC.dataCurta(k.semana); }), { meta: c.meta_leads_semana ? Number(c.meta_leads_semana) : 0, unid: ' leads', titulo: 'Leads por semana' }) + '</div>' +
      '<div><div class="graf-tit"><span>Nota de relacionamento</span><span class="faint">tracejado: 7 e 9</span></div>' +
      BC.graf.notas(relAsc.map(function (k) { return Number(k.nota_rel); }), relAsc.map(function (k) { return BC.dataCurta(k.semana); })) + '</div></div>';

    out += '<section class="bloco"><div class="bloco-cab"><h2>Check-ins semanais</h2></div>';
    if (!cks.length) out += '<p class="vazio">Nenhum check-in ainda.' + (perdido ? '' : ' Use o botão “Check-in” acima.') + '</p>';
    else {
      out += '<div class="rolagem"><table class="tabela"><thead><tr><th>Semana</th><th class="num">Investido</th><th class="num">Leads</th><th class="num hide-s">CPL</th><th class="num hide-s">Vendas</th><th>Relac.</th><th class="hide-s">Sinais</th><th class="hide-s">Feito → próxima ação</th></tr></thead><tbody>';
      cks.forEach(function (k) {
        var cp = C.cpl(k.investimento, k.leads);
        out += '<tr class="clicavel" data-act="checkin" data-id="' + esc(id) + '" data-semana="' + esc(k.semana) + '"><td class="nowrap">' + BC.dataCurta(k.semana) + '</td>' +
          '<td class="num">' + (k.investimento != null ? BC.brl(k.investimento) : '—') + '</td><td class="num">' + (k.leads != null ? k.leads : '—') + '</td>' +
          '<td class="num hide-s">' + (cp != null ? BC.brl2(cp) : '—') + '</td><td class="num hide-s">' + (k.vendas != null ? k.vendas : '—') + '</td>' +
          '<td>' + BC.pillRel(k.nota_rel) + '</td><td class="hide-s">' + (k.gatilhos && k.gatilhos.length ? '<span class="pill amarelo sem-ponto">' + k.gatilhos.length + '</span>' : '<span class="faint">—</span>') + '</td>' +
          '<td class="truncar hide-s">' + esc([k.feito, k.proximo].filter(Boolean).join(' → ') || '—') + '</td></tr>';
      });
      out += '</tbody></table></div>';
    }
    out += '</section>';

    out += '<section class="bloco espaco"><div class="bloco-cab"><h2>Feedbacks</h2>' + (perdido ? '' : '<button class="btn mini" data-act="novo-feedback" data-id="' + esc(id) + '">+ Feedback</button>') + '</div>';
    if (!fbs.length) out += '<p class="vazio">Nenhum feedback registrado.</p>';
    else out += '<ul class="linhas">' + fbs.map(function (f) {
      return '<li><div class="corpo"><div><span class="pill ' + f.tom + '">' + ({ positivo: 'Positivo', neutro: 'Neutro', negativo: 'Negativo' }[f.tom] || f.tom) + '</span> <span class="small muted">' + BC.data(f.data) + (f.canal ? ' · ' + esc({ whatsapp: 'WhatsApp', reuniao: 'Reunião', ligacao: 'Ligação', outro: 'Outro' }[f.canal] || f.canal) : '') + '</span></div><div style="margin-top:4px;overflow-wrap:anywhere">' + esc(f.texto) + '</div></div>' +
        '<div class="acoes"><button class="btn mini fantasma" data-act="excluir-feedback" data-id="' + esc(f.id) + '" aria-label="Remover feedback">Remover</button></div></li>';
    }).join('') + '</ul>';
    out += '</section>';
    if (c.notas) out += '<section class="bloco espaco"><div class="bloco-cab"><h2>Notas</h2></div><p style="white-space:pre-wrap;overflow-wrap:anywhere">' + esc(c.notas) + '</p></section>';
    return out;
  };

  // ───────────── churn ─────────────
  BC.views.churn = function () {
    var x = BC.ctx(), h = x.h, e = C.estatChurn(x.clientes, h);
    var comBase = e.meses.filter(function (m) { return m.churnPct != null; });
    var churnMedio = comBase.length ? comBase.reduce(function (s, m) { return s + m.churnPct; }, 0) / comBase.length : null;
    var motivos = Object.keys(e.porMotivo).map(function (k) { return [k, e.porMotivo[k]]; }).sort(function (a, b) { return b[1] - a[1]; });
    var out = '<div class="pagehead"><div><h1>Churn</h1><p class="sub">O padrão dos motivos importa mais que cada saída isolada.</p></div></div>' + bannerExemplos();
    if (!e.perdidos.length) return out + '<p class="vazio">Nenhum cliente perdido registrado. Quando alguém sair, use “Dar churn” na ficha do cliente.</p>';
    out += '<div class="faixa">' +
      '<div><div class="rot">Clientes perdidos</div><div class="val">' + e.perdidos.length + '</div><div class="nota">MRR perdido ' + BC.brl(soma(e.perdidos, function (c) { return c.mensalidade; })) + '</div></div>' +
      '<div><div class="rot">Churn mensal médio</div><div class="val">' + (churnMedio == null ? '—' : BC.n1(churnMedio) + '%') + '</div><div class="nota">últimos 12 meses</div></div>' +
      '<div><div class="rot">LT médio dos perdidos</div><div class="val">' + BC.n1(e.ltMedio) + '<span class="faint" style="font-size:16px"> meses</span></div></div>' +
      '<div><div class="rot">LTV médio dos perdidos</div><div class="val">' + BC.brl(e.ltvMedio) + '</div></div></div>';
    var maxM = motivos.length ? motivos[0][1] : 1;
    out += '<div class="colunas"><section class="bloco"><div class="bloco-cab"><h2>Motivos de saída</h2></div><div class="barras">' + motivos.map(function (m) {
      return '<div class="barra"><span>' + esc(BC.nomeMotivo(m[0])) + '</span><div class="trilho"><i style="width:' + (m[1] / maxM * 100) + '%"></i></div><span class="v">' + m[1] + ' (' + Math.round(m[1] / e.perdidos.length * 100) + '%)</span></div>';
    }).join('') + '</div><p class="small muted" style="margin-top:10px">Mais frequente: <strong>' + esc(BC.nomeMotivo(motivos[0][0])) + '</strong>.</p></section>';
    var meses = e.meses.filter(function (m) { return m.saidas > 0 || m.mes >= C.addMesesMes(h, -5); });
    out += '<section class="bloco"><div class="bloco-cab"><h2>Ao longo do tempo</h2></div><div class="rolagem"><table class="tabela"><thead><tr><th>Mês</th><th class="num">Saídas</th><th class="num">Churn</th><th class="num hide-s">LT médio</th><th class="num hide-s">LTV médio</th></tr></thead><tbody>' +
      meses.map(function (m) {
        return '<tr><td>' + BC.mes(m.mes) + '</td><td class="num">' + m.saidas + '</td><td class="num">' + (m.churnPct == null ? '—' : BC.n1(m.churnPct) + '%') + '</td><td class="num hide-s">' + (m.ltMedio == null ? '—' : BC.n1(m.ltMedio) + ' m') + '</td><td class="num hide-s">' + (m.ltvMedio == null ? '—' : BC.brl(m.ltvMedio)) + '</td></tr>';
      }).join('') + '</tbody></table></div></section></div>';
    out += '<section class="bloco espaco"><div class="bloco-cab"><h2>Clientes perdidos</h2></div><div class="rolagem"><table class="tabela"><thead><tr><th>Cliente</th><th>Motivo</th><th>Saída</th><th class="num hide-s">LT</th><th class="num hide-s">LTV</th><th class="hide-s">O que eu faria diferente</th></tr></thead><tbody>' +
      e.perdidos.sort(function (a, b) { return a.churn_data < b.churn_data ? 1 : -1; }).map(function (c) {
        return '<tr class="clicavel" data-act="abrir-cliente" data-id="' + esc(c.id) + '"><td class="nome">' + esc(c.nome) + '</td><td>' + esc(BC.nomeMotivo(c.churn_motivo)) + '</td><td class="nowrap">' + BC.data(c.churn_data) + '</td>' +
          '<td class="num hide-s">' + BC.n1(C.ltMeses(c, h)) + ' m</td><td class="num hide-s">' + BC.brl(C.ltv(c, h)) + '</td><td class="hide-s" style="max-width:340px;overflow-wrap:anywhere">' + esc(c.churn_aprendizados || '—') + '</td></tr>';
      }).join('') + '</tbody></table></div></section>';
    return out;
  };

  // ───────────── previsão de MRR ─────────────
  function premissas(ativos) {
    var pr = Object.assign({}, C.PROB_RENOVACAO_PADRAO, S.cfg('prob_renovacao', {}));
    var pe = Object.assign({}, C.PROB_ETAPA_PADRAO, S.cfg('prob_etapa', {}));
    var ticket = Number(S.cfg('ticket_padrao', 0)) || (ativos.length ? soma(ativos, function (c) { return c.mensalidade; }) / ativos.length : 0);
    return { renov: pr, etapa: pe, ticket: ticket, ticketManual: Number(S.cfg('ticket_padrao', 0)) || 0 };
  }
  BC.views.previsao = function () {
    var x = BC.ctx(), h = x.h, pm = premissas(x.ativos);
    var farois = {}; x.ativos.forEach(function (c) { farois[c.id] = x.saude[c.id].farol; });
    var prev = C.previsaoMrr(x.clientes, farois, pm.renov, h, 6);
    var hist = C.historicoMrr(x.clientes, h, 6);
    var pipe = C.pipelinePonderado(S.all('prospects'), pm.etapa, pm.ticket);
    var conc = C.concentracao(x.ativos);
    var mrr = soma(x.ativos, function (c) { return c.mensalidade; });
    var out = '<div class="pagehead"><div><h1>Previsão de MRR</h1><p class="sub">Próximos 6 meses a partir dos contratos, do farol de cada cliente e do pipeline.</p></div></div>' + bannerExemplos();
    if (!x.ativos.length) return out + '<p class="vazio">Cadastre clientes com contrato para ver a previsão.</p>';
    var m3 = prev[3] || prev[prev.length - 1];
    out += '<div class="faixa">' +
      '<div><div class="rot">MRR hoje</div><div class="val">' + BC.brl(mrr) + '</div><div class="nota">' + x.ativos.length + ' contratos ativos</div></div>' +
      '<div><div class="rot">Contratado em ' + BC.mes(m3.mes) + '</div><div class="val">' + BC.brl(m3.contratado) + '</div><div class="nota">só contratos vigentes</div></div>' +
      '<div><div class="rot">Esperado em ' + BC.mes(m3.mes) + '</div><div class="val">' + BC.brl(m3.esperado) + '</div><div class="nota">com renovações prováveis</div></div>' +
      '<div><div class="rot">Pipeline ponderado</div><div class="val">' + BC.brl(pipe.mrr) + '</div><div class="nota">' + pipe.n + ' contatos em aberto</div></div>' +
      '<div><div class="rot">Concentração</div><div class="val">' + BC.pct(conc.top1) + '</div><div class="nota">maior cliente · top 3 = ' + BC.pct(conc.top3) + '</div></div></div>';
    out += '<section class="bloco"><div class="bloco-cab"><h2>MRR: histórico e previsão</h2></div>' + BC.graf.mrr(hist, prev) + '</section>';

    out += '<div class="colunas espaco"><section class="bloco"><div class="bloco-cab"><h2>Mês a mês</h2></div><div class="rolagem"><table class="tabela"><thead><tr><th>Mês</th><th class="num">Contratado</th><th class="num">Esperado</th><th class="num">+ pipeline</th></tr></thead><tbody>' +
      prev.map(function (p, i) {
        return '<tr><td>' + BC.mes(p.mes) + (i === 0 ? ' <span class="faint small">(atual)</span>' : '') + '</td><td class="num">' + BC.brl(p.contratado) + '</td><td class="num">' + BC.brl(p.esperado) + '</td><td class="num">' + BC.brl(p.esperado + (i >= 2 ? pipe.mrr : 0)) + '</td></tr>';
      }).join('') + '</tbody></table></div><p class="small faint" style="margin-top:8px">“+ pipeline” soma o novo MRR esperado do CRM a partir do segundo mês, supondo fechamento em até 60 dias.</p></section>';

    var movim = hist.slice().reverse();
    out += '<section class="bloco"><div class="bloco-cab"><h2>Movimento do MRR</h2></div><div class="rolagem"><table class="tabela"><thead><tr><th>Mês</th><th class="num">MRR</th><th class="num">Novo</th><th class="num">Perdido</th></tr></thead><tbody>' +
      movim.map(function (m) { return '<tr><td>' + BC.mes(m.mes) + '</td><td class="num">' + BC.brl(m.mrr) + '</td><td class="num">' + (m.novo ? '+' + BC.brl(m.novo) : '—') + '</td><td class="num">' + (m.perdido ? '−' + BC.brl(m.perdido) : '—') + '</td></tr>'; }).join('') +
      '</tbody></table></div><p class="small faint" style="margin-top:8px">Assume a mensalidade atual em todo o período (a ferramenta não guarda reajustes).</p></section></div>';

    var ate = C.addMeses(h, 6);
    var renov = x.ativos.filter(function (c) { return C.fimContrato(c) <= ate; }).sort(function (a, b) { return C.fimContrato(a) < C.fimContrato(b) ? -1 : 1; });
    out += '<section class="bloco espaco"><div class="bloco-cab"><h2>Renovações nos próximos 6 meses</h2></div>';
    if (!renov.length) out += '<p class="vazio">Nenhum contrato vence neste período.</p>';
    else out += '<div class="rolagem"><table class="tabela"><thead><tr><th>Cliente</th><th>Termina</th><th>Farol</th><th class="num">Chance de renovar</th><th class="num">Mensalidade</th><th class="num">Valor esperado</th></tr></thead><tbody>' +
      renov.map(function (c) {
        var f = farois[c.id], p = pm.renov[f];
        return '<tr class="clicavel" data-act="abrir-cliente" data-id="' + esc(c.id) + '"><td class="nome">' + esc(c.nome) + '</td><td class="nowrap">' + BC.data(C.fimContrato(c)) + '</td><td>' + BC.pillFarol(f) + '</td><td class="num">' + BC.pct(p) + '</td><td class="num">' + BC.brl(c.mensalidade) + '</td><td class="num">' + BC.brl(c.mensalidade * p) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    out += '</section>';

    out += '<section class="bloco espaco"><div class="bloco-cab"><h2>Premissas</h2></div><p class="small muted" style="margin-bottom:10px">São estimativas suas, não dados. Ajuste conforme o seu histórico real de renovação e de fechamento.</p>' +
      '<form data-form="premissas"><div class="grade">' +
      ['verde', 'amarelo', 'vermelho'].map(function (f) { return '<div class="campo"><label for="pm-r-' + f + '">Chance de renovar · farol ' + f + ' (%)</label><input id="pm-r-' + f + '" name="r_' + f + '" type="number" min="0" max="100" step="1" value="' + Math.round(pm.renov[f] * 100) + '"></div>'; }).join('') +
      '</div><div class="grade" style="margin-top:12px">' +
      [['abordado', 'Abordado'], ['respondeu', 'Respondeu'], ['diagnostico', 'Mini-diagnóstico'], ['reuniao', 'Reunião'], ['proposta', 'Proposta']].map(function (e) { return '<div class="campo"><label for="pm-e-' + e[0] + '">Fechar · etapa ' + e[1] + ' (%)</label><input id="pm-e-' + e[0] + '" name="e_' + e[0] + '" type="number" min="0" max="100" step="0.5" value="' + (Math.round(pm.etapa[e[0]] * 1000) / 10) + '"></div>'; }).join('') +
      '<div class="campo"><label for="pm-ticket">Ticket de um cliente novo (R$)</label><input id="pm-ticket" name="ticket" type="number" min="0" step="any" value="' + (pm.ticketManual || '') + '" placeholder="' + Math.round(pm.ticket) + '"><small>Em branco: usa o ticket médio atual.</small></div></div>' +
      '<p class="erro-form" hidden role="alert"></p><div style="margin-top:12px"><button class="btn primario" type="submit">Salvar premissas</button></div></form></section>';
    out += '<p class="small faint" style="margin-top:14px">Concentração: quando poucos clientes respondem pela maior parte do MRR, a receita é frágil. Com poucos clientes isso é natural no começo; acompanhe se cai conforme a carteira cresce.</p>';
    return out;
  };
  BC.forms.premissas = function (form) {
    var d = BC.dados(form), pr = {}, pe = {};
    ['verde', 'amarelo', 'vermelho'].forEach(function (f) { pr[f] = Math.min(1, Math.max(0, (Number(d['r_' + f]) || 0) / 100)); });
    ['abordado', 'respondeu', 'diagnostico', 'reuniao', 'proposta'].forEach(function (e) { pe[e] = Math.min(1, Math.max(0, (Number(d['e_' + e]) || 0) / 100)); });
    BC.seguro(async function () {
      await S.setCfg('prob_renovacao', pr); await S.setCfg('prob_etapa', pe); await S.setCfg('ticket_padrao', BC.num(d.ticket) || 0);
      BC.toast('Premissas salvas.');
    }, form);
  };

  // ───────────── dados e backup ─────────────
  BC.views.dados = function () {
    var out = '<div class="pagehead"><div><h1>Dados</h1><p class="sub">Backup, exemplos e preferências.</p></div></div>' + bannerArmazenamento() + bannerExemplos();
    out += '<div class="colunas"><section class="bloco"><div class="bloco-cab"><h2>Onde ficam os dados</h2></div>' +
      (S.modo() === 'supabase' ? '<p>Seus dados estão no <strong>Supabase</strong>, protegidos por login.</p>' : '<p>Os dados estão neste navegador (<strong>modo local</strong>). Trocar de navegador ou limpar os dados do site apaga tudo. Na etapa seguinte a ferramenta passa a gravar no Supabase.</p>') +
      '<p class="small muted" style="margin-top:8px">Os exemplos não entram no backup.</p></section>' +
      '<section class="bloco"><div class="bloco-cab"><h2>Backup</h2></div><div class="pagehead-acoes"><button class="btn" data-act="exportar">Baixar backup (.json)</button><button class="btn" data-act="copiar-backup">Copiar backup</button></div>' +
      '<div class="campo" style="margin-top:14px"><label for="arq-backup">Restaurar de um arquivo</label><input id="arq-backup" type="file" accept=".json,application/json" data-change="arquivo-backup"></div>' +
      '<p class="small muted" style="margin-top:6px">A restauração soma os registros do arquivo aos que já existem (ids repetidos são ignorados).</p><p class="erro-form" id="erro-backup" hidden role="alert"></p></section>' +
      '<section class="bloco"><div class="bloco-cab"><h2>Exemplos</h2></div><p class="muted">Clientes e contatos fictícios para ver as telas funcionando.</p><div class="pagehead-acoes" style="margin-top:10px">' +
      '<button class="btn" data-act="carregar-exemplos"' + (S.temExemplos() ? ' disabled' : '') + '>Carregar exemplos</button><button class="btn" data-act="limpar-exemplos"' + (S.temExemplos() ? '' : ' disabled') + '>Limpar exemplos</button></div></section>' +
      '<section class="bloco"><div class="bloco-cab"><h2>Preferências</h2></div><form data-form="preferencias"><div class="campo"><label for="pf-meta">Meta diária de toques na prospecção</label><input id="pf-meta" name="meta" type="number" min="1" step="1" value="' + (Number(S.cfg('meta_diaria', 5)) || 5) + '"></div><p class="erro-form" hidden role="alert"></p><div style="margin-top:12px"><button class="btn primario" type="submit">Salvar</button></div></form></section></div>';
    return out;
  };
  BC.forms.preferencias = function (form) {
    var d = BC.dados(form);
    BC.seguro(async function () { await S.setCfg('meta_diaria', Math.max(1, Math.round(Number(d.meta) || 5))); BC.toast('Preferências salvas.'); }, form);
  };
  BC.act['exportar'] = function () {
    var json = JSON.stringify(S.exportar(), null, 2);
    try {
      var url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
      var a = document.createElement('a'); a.href = url; a.download = 'agencia-bc-backup-' + C.hoje() + '.json';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      BC.toast('Backup gerado. Se nada baixou, use “Copiar backup”.');
    } catch (e) { BC.toast('Não foi possível baixar. Use “Copiar backup”.', true); }
  };
  BC.act['copiar-backup'] = function () {
    var json = JSON.stringify(S.exportar());
    var ok = function () { BC.toast('Backup copiado. Cole em um arquivo .json e guarde.'); };
    var falha = function () {
      var d = BC.dialogo('<div class="dlg">' + BC.cabDialogo('Backup', 'Selecione tudo e copie.') + '<textarea id="bk" style="min-height:240px" readonly>' + esc(json) + '</textarea></div>');
      var t = d.querySelector('textarea'); t.focus(); t.select();
    };
    try { navigator.clipboard.writeText(json).then(ok, falha); } catch (e) { falha(); }
  };
  BC.act['arquivo-backup'] = function (el) {
    var f = el.files && el.files[0]; if (!f) return;
    var err = document.getElementById('erro-backup');
    var r = new FileReader();
    r.onload = function () {
      BC.seguro(async function () {
        await S.importar(JSON.parse(r.result), false);
        if (err) err.hidden = true;
        BC.toast('Backup restaurado.');
      }).then(function () { el.value = ''; });
    };
    r.onerror = function () { BC.toast('Não consegui ler o arquivo.', true); };
    r.readAsText(f);
  };
  BC.act['limpar-exemplos'] = function () { BC.seguro(async function () { await S.limparExemplos(); BC.toast('Exemplos removidos.'); }); };
  BC.act['carregar-exemplos'] = function () {
    BC.seguro(async function () { await S.carregarExemplos(root.BCSeed.gerar(C.hoje())); BC.toast('Exemplos carregados.'); });
  };
})(window);

</script>
<script>
/* Agência BC · tela de prospecção (CRM): indicadores, "Pra hoje", novo contato, quadro, lista e funil. */
(function (root) {
  'use strict';
  var C = root.BCCalc, S = root.BCStore, BC = root.BC, esc = BC.esc;
  var ORIGEM_NOME = { lista: 'Lista', meta_ads: 'Meta Ads', indicacao: 'Indicação', outro: 'Outro' };
  var CANAIS = [['whatsapp', 'WhatsApp'], ['instagram', 'Instagram DM'], ['email', 'E-mail'], ['ligacao', 'Ligação'], ['linkedin', 'LinkedIn'], ['presencial', 'Presencial']];

  function aberto(p) { return p.etapa !== 'fechado' && p.etapa !== 'perdido'; }
  function titulo(p) { return p.nome || p.negocio || 'Sem nome'; }
  function sub(p) {
    var a = [];
    if (p.negocio && p.negocio !== p.nome) a.push(p.negocio);
    if (p.nicho && p.nicho !== p.negocio) a.push(p.nicho);
    var loc = [p.cidade, p.estado].filter(Boolean).join(' - ');
    if (loc) a.push(loc);
    return a.join(' · ');
  }
  function digitos(t) { return String(t || '').replace(/\D/g, ''); }

  // ícones de contato: W (WhatsApp), @ (e-mail), IG (Instagram), telefone
  BC.iconesContato = function (p) {
    var wa = BC.waLink(p.telefone), ig = BC.igLink(p.instagram), d = digitos(p.telefone);
    function ico(href, txt, rot, extra) {
      return href ? '<a class="ico-c" href="' + esc(href) + '" target="_blank" rel="noopener" title="' + rot + '" aria-label="' + rot + '">' + txt + '</a>'
        : '<span class="ico-c off" title="' + rot + ': não informado" aria-label="' + rot + ' não informado">' + txt + '</span>';
    }
    return '<span class="ico-linha">' +
      ico(wa, 'W', 'WhatsApp') +
      ico(p.email ? 'mailto:' + p.email : '', '@', 'E-mail') +
      ico(ig, 'IG', 'Instagram') +
      ico(d ? 'tel:+' + d : '', '&#9742;', 'Ligar') + '</span>';
  };

  function estados(todos) {
    var ufs = {}; todos.forEach(function (p) { if (p.estado) ufs[p.estado] = (ufs[p.estado] || 0) + 1; });
    var ks = Object.keys(ufs).sort(); if (!ks.length) return '';
    return '<select data-change="filtro-pros" data-filtro="pEstado" aria-label="Estado"><option value="">Todos os estados</option>' + ks.map(function (k) { return '<option value="' + k + '"' + (BC.ui.pEstado === k ? ' selected' : '') + '>' + k + ' (' + ufs[k] + ')</option>'; }).join('') + '</select>';
  }
  function quando(p, h) {
    if (!p.proxima_data) return '';
    var d = C.diffDias(h, p.proxima_data);
    if (d < 0) return '<span class="chip atrasado">atrasado · ' + BC.rotuloDias(d) + '</span>';
    if (d === 0) return '<span class="chip hoje">é hoje</span>';
    return '<span class="chip">' + BC.dataCurta(p.proxima_data) + '</span>';
  }

  // ───────── cartão do quadro ─────────
  function cartao(p, h) {
    var prox = C.ORDEM_FUNIL[C.ORDEM_FUNIL.indexOf(p.etapa) + 1];
    return '<div class="cartao" data-act="abrir-prospect" data-id="' + esc(p.id) + '" tabindex="0">' +
      '<div class="t">' + esc(titulo(p)) + '</div>' +
      (sub(p) ? '<div class="d">' + esc(sub(p)) + '</div>' : '') +
      '<div class="linha">' + quando(p, h) + (p.origem === 'meta_ads' ? '<span class="chip acc">Meta Ads</span>' : '') + (p.toques ? '<span class="chip">' + p.toques + (p.toques === 1 ? ' toque' : ' toques') + '</span>' : '') + '</div>' +
      '<div class="linha">' + BC.iconesContato(p) + '</div>' +
      (prox ? '<div class="linha"><button type="button" class="btn-av" data-act="avancar" data-id="' + esc(p.id) + '">' + (prox === 'fechado' ? 'fechar cliente' : 'avançar') + ' &rarr;</button></div>' : '') +
      '</div>';
  }
  function filtrar(todos) {
    var u = BC.ui, q = C.semAcento(u.pBusca || '').trim();
    return todos.filter(function (p) {
      if (u.pEtapa && p.etapa !== u.pEtapa) return false;
      if (u.pOrigem && p.canal !== u.pOrigem) return false; // pOrigem guarda o canal
      if (u.pEstado && p.estado !== u.pEstado) return false;
      if (q && C.semAcento([p.nome, p.negocio, p.nicho, p.cidade, p.estado, p.telefone, p.instagram, p.email].join(' ')).indexOf(q) < 0) return false;
      return true;
    });
  }
  function quadro(h, todos) {
    var out = '<div class="quadro">';
    C.ORDEM_FUNIL.forEach(function (et) {
      var col = todos.filter(function (p) { return p.etapa === et; });
      col.sort(function (a, b) { return (a.proxima_data || '9999') < (b.proxima_data || '9999') ? -1 : 1; });
      out += '<div class="col" data-etapa="' + et + '"><div class="col-cab">' + esc(BC.nomeEtapa(et)) + '<span>' + col.length + '</span></div>';
      col.slice(0, 40).forEach(function (p) { out += cartao(p, h); });
      if (col.length > 40) out += '<p class="small muted" style="padding:4px 6px">+ ' + (col.length - 40) + ' na vista Lista</p>';
      if (!col.length) out += '<p class="small faint" style="padding:6px 4px">vazio</p>';
      out += '</div>';
    });
    return out + '</div>';
  }
  function selecionados(todos) {
    var sel = BC.ui.sel || (BC.ui.sel = {});
    return todos.filter(function (p) { return sel[p.id]; });
  }
  function lista(h, todos) {
    if (!todos.length) return '<p class="vazio">Nenhum contato com esses filtros.</p>';
    todos = todos.slice().sort(function (a, b) { return (b.atualizado_em || b.created_at || '') < (a.atualizado_em || a.created_at || '') ? -1 : 1; });
    var sel = BC.ui.sel || (BC.ui.sel = {}), n = selecionados(todos).length, tudo = n === todos.length;
    var barra = '<div class="sel-bar">' + (n
      ? '<span><strong>' + n + '</strong> ' + (n === 1 ? 'selecionado' : 'selecionados') + '</span>' +
        (tudo ? '' : '<button type="button" class="btn mini" data-act="sel-todos">Selecionar todos (' + todos.length + ')</button>') +
        '<button type="button" class="btn mini perigo" data-act="apagar-sel">Apagar selecionados</button>' +
        '<button type="button" class="btn mini fantasma" data-act="sel-limpar">Limpar seleção</button>'
      : '<span class="faint small">Marque os contatos que quer apagar, ou</span><button type="button" class="btn mini" data-act="sel-todos">Selecionar todos (' + todos.length + ')</button>') + '</div>';
    return barra + '<div class="rolagem"><table class="tabela"><thead><tr><th class="sel" data-act="sel-todos" title="Selecionar todos"><input type="checkbox" tabindex="-1" aria-label="Selecionar todos"' + (tudo ? ' checked' : '') + '></th><th>Contato</th><th class="hide-s">Telefone</th><th class="hide-s">Origem</th><th>Etapa</th><th>Próxima etapa</th><th class="num hide-s">Toques</th></tr></thead><tbody>' +
      todos.slice(0, 300).map(function (p) {
        return '<tr class="clicavel" data-act="abrir-prospect" data-id="' + esc(p.id) + '"><td class="sel" data-act="sel-pros" data-id="' + esc(p.id) + '"><input type="checkbox" tabindex="-1" aria-label="Selecionar ' + esc(titulo(p)) + '"' + (sel[p.id] ? ' checked' : '') + '></td><td><div class="nome">' + esc(titulo(p)) + '</div><div class="small faint">' + esc(sub(p)) + '</div></td>' +
          '<td class="hide-s nowrap mono small">' + esc(p.telefone || '—') + '</td><td class="hide-s">' + esc(ORIGEM_NOME[p.origem] || p.origem) + '</td>' +
          '<td><span class="tag">' + esc(BC.nomeEtapa(p.etapa)) + '</span></td><td>' + (quando(p, h) || '<span class="faint">—</span>') + (p.proxima_acao ? ' <span class="small muted">' + esc(p.proxima_acao) + '</span>' : '') + '</td><td class="num hide-s">' + (p.toques || 0) + '</td></tr>';
      }).join('') + '</tbody></table></div><p class="small faint" style="margin-top:6px">' + todos.length + ' contatos' + (todos.length > 300 ? ' (mostrando os 300 mais recentes; "Selecionar todos" pega todos os ' + todos.length + ')' : '') + '.</p>';
  }

  // ───────── funil ─────────
  function funilHTML(todos) {
    if (!todos.length) return '<p class="vazio">Sem contatos ainda.</p>';
    var f = C.funil(todos), total = f[0].n || 1;
    var out = '<div class="colunas"><section class="bloco"><div class="bloco-cab"><h2>Funil</h2></div><div class="barras">' + f.map(function (e, i) {
      return '<div class="barra"><span>' + esc(e.nome) + '</span><div class="trilho"><i style="width:' + (e.n / total * 100) + '%"></i></div><span class="v">' + e.n + (i > 0 && e.deAnterior != null ? ' · ' + BC.pct(e.deAnterior) : '') + '</span></div>';
    }).join('') + '</div><p class="small faint" style="margin-top:10px">A porcentagem é sobre a etapa anterior. Conta quem já passou por cada etapa, inclusive os perdidos depois.</p></section>';
    out += '<section class="bloco"><div class="bloco-cab"><h2>Por origem</h2></div><div class="rolagem"><table class="tabela"><thead><tr><th>Origem</th><th class="num">Contatos</th><th class="num">Responderam</th><th class="num">Fechados</th><th class="num">Conversão</th></tr></thead><tbody>' +
      Object.keys(ORIGEM_NOME).map(function (o) {
        var ps = todos.filter(function (p) { return p.origem === o; }); if (!ps.length) return '';
        var ff = C.funil(ps);
        return '<tr><td>' + ORIGEM_NOME[o] + '</td><td class="num">' + ps.length + '</td><td class="num">' + ff[2].n + '</td><td class="num">' + ff[6].n + '</td><td class="num">' + BC.pct(ps.length ? ff[6].n / ps.length : null, 1) + '</td></tr>';
      }).join('') + '</tbody></table></div></section></div>';
    var perdidos = todos.filter(function (p) { return p.etapa === 'perdido'; }), pm = {};
    perdidos.forEach(function (p) { var k = p.motivo_perda || 'Sem motivo'; pm[k] = (pm[k] || 0) + 1; });
    if (perdidos.length) {
      var ks = Object.keys(pm).sort(function (a, b) { return pm[b] - pm[a]; }), mx = pm[ks[0]];
      out += '<section class="bloco espaco"><div class="bloco-cab"><h2>Motivos de perda</h2></div><div class="barras">' + ks.map(function (k) {
        return '<div class="barra"><span>' + esc(k) + '</span><div class="trilho"><i style="width:' + (pm[k] / mx * 100) + '%"></i></div><span class="v">' + pm[k] + '</span></div>';
      }).join('') + '</div></section>';
    }
    return out;
  }

  // ───────── novo contato (inline) ─────────
  function formNovo() {
    var o = CANAIS.map(function (c) { return '<option value="' + c[0] + '">' + c[1] + '</option>'; }).join('');
    return '<form class="novo-contato" data-form="prospect" data-id="" id="form-novo" autocomplete="off">' +
      '<div class="nc-cab"><span class="nc-mais">+</span><div><h3>NOVO CONTATO</h3><p class="small muted">Só o nome já basta pra começar. O resto você completa depois, na ficha.</p></div></div>' +
      '<div class="nc-grade">' +
      '<div class="campo"><label for="nc-nome">Nome do contato</label><input id="nc-nome" name="nome" type="text" placeholder="Ex: Rafael Souza" required></div>' +
      '<div class="campo"><label for="nc-negocio">Negócio / nicho</label><input id="nc-negocio" name="negocio" type="text" placeholder="Ex: Barbearia Imperial, estética"></div>' +
      '<div class="campo"><label for="nc-tel">Telefone / WhatsApp</label><input id="nc-tel" name="telefone" type="tel" inputmode="tel" placeholder="Ex: (19) 99999-8888"></div>' +
      '<div class="campo"><label for="nc-email">E-mail</label><input id="nc-email" name="email" type="email" placeholder="Ex: rafael@barbearia.com"></div>' +
      '<div class="campo"><label for="nc-ig">@ do Instagram</label><input id="nc-ig" name="instagram" type="text" placeholder="Ex: @barbeariaimperial"></div>' +
      '<div class="campo"><label for="nc-cidade">Cidade</label><input id="nc-cidade" name="cidade" type="text" placeholder="Ex: Boa Vista"></div>' +
      '<div class="campo"><label for="nc-estado">Estado (UF)</label><input id="nc-estado" name="estado" type="text" maxlength="2" placeholder="Ex: RR" style="text-transform:uppercase"></div>' +
      '<div class="campo"><label for="nc-canal">Canal do primeiro toque</label><select id="nc-canal" name="canal">' + o + '</select></div>' +
      '<div class="campo"><label for="nc-prox">Próxima etapa</label><input id="nc-prox" name="proxima_data" type="date" value="' + C.hoje() + '"></div></div>' +
      '<input type="hidden" name="etapa" value="novo"><input type="hidden" name="origem" value="lista">' +
      '<p class="erro-form" hidden role="alert"></p>' +
      '<div class="nc-rodape"><button type="button" class="btn" data-act="cancelar-novo">Cancelar</button><button type="submit" class="btn primario">Adicionar contato</button></div></form>';
  }

  BC.views.prospeccao = function () {
    var h = C.hoje(), todos = S.all('prospects'), u = BC.ui;
    var meta = Number(S.cfg('meta_diaria', 5)) || 5;
    var datas = S.all('atividades').filter(function (a) { return a.tipo === 'toque'; }).map(function (a) { return C.dataLocalDe(a.created_at); });
    var sq = C.sequencia(datas, meta, h);
    var abertos = todos.filter(aberto);
    var leads = abertos.filter(function (p) { return p.origem === 'meta_ads' && p.etapa === 'novo'; });
    var devidos = abertos.filter(function (p) { return p.proxima_data && p.proxima_data <= h && leads.indexOf(p) < 0; })
      .sort(function (a, b) { return a.proxima_data < b.proxima_data ? -1 : 1; });
    var pendentes = leads.concat(devidos);
    var f = C.funil(todos);
    function taxa(a, b) { return b ? BC.pct(a / b, 0) : '—'; }
    var kpis = [
      ['Etapas pra hoje', pendentes.length, true], ['No painel', abertos.length], ['Em cadência', abertos.filter(function (p) { return p.etapa === 'abordado'; }).length],
      ['Taxa de resposta', taxa(f[2].n, f[1].n)], ['Resposta → reunião', taxa(f[4].n, f[2].n)], ['Reunião → cliente', taxa(f[6].n, f[4].n)], ['Fechados', todos.filter(function (p) { return p.etapa === 'fechado'; }).length]
    ];

    var out = '<div class="pros-topo"><span class="pill-marca">CRM</span>' +
      '<div class="pros-meta"><span title="Dias úteis seguidos batendo a meta"><i class="losango"></i>' + sq.streak + (sq.streak === 1 ? ' dia' : ' dias') + '</span>' +
      '<label>Meta/dia <input type="number" min="1" max="200" value="' + meta + '" data-change="meta-dia" aria-label="Meta de toques por dia"></label>' +
      '<span>hoje: ' + sq.hoje + '/' + meta + '</span></div></div>';
    out += '<div class="kpis">' + kpis.map(function (k) { return '<div class="kpi' + (k[2] ? ' dest' : '') + '"><div class="rot">' + k[0] + '</div><div class="val">' + k[1] + '</div></div>'; }).join('') + '</div>';

    // Pra hoje
    out += '<section class="pra-hoje"><div class="ph-cab"><span>Pra hoje · o painel que te cobra</span><span>' + pendentes.length + '</span></div><div class="ph-corpo">';
    if (!pendentes.length) {
      var falta = Math.max(0, meta - sq.hoje);
      out += '<p class="ph-ok"><strong>&#10003; Nenhuma etapa pendente.</strong> ' + (falta ? 'Agora é abrir conversa nova: faltam ' + falta + ' pra bater a meta de hoje.' : 'Meta de hoje batida.') + '</p>';
    } else {
      out += '<ul class="linhas">' + pendentes.map(function (p) {
        var wa = BC.waLink(p.telefone);
        return '<li><div class="corpo"><div class="tit">' + esc(titulo(p)) + ' <span class="tag">' + esc(BC.nomeEtapa(p.etapa)) + '</span>' + (p.origem === 'meta_ads' ? ' <span class="chip acc">Meta Ads</span>' : '') + '</div>' +
          '<div class="det">' + esc(sub(p)) + (sub(p) ? ' · ' : '') + esc(p.proxima_acao || (p.origem === 'meta_ads' ? 'Responder o lead' : 'Follow-up')) + ' ' + quando(p, h) +
          (p.abordagem ? '' : ' <span class="tag">sem abordagem</span>') + (p.diagnostico ? '' : ' <span class="tag">sem mini-diagnóstico</span>') + '</div></div>' +
          '<div class="acoes">' + (wa ? '<a class="btn mini" href="' + esc(wa) + '" target="_blank" rel="noopener">WhatsApp</a>' : '') +
          '<button class="btn mini primario" data-act="toque" data-id="' + esc(p.id) + '">Toque</button>' +
          (p.etapa === 'abordado' || p.etapa === 'novo' ? '<button class="btn mini" data-act="respondeu" data-id="' + esc(p.id) + '">Respondeu</button>' : '') +
          '<button class="btn mini fantasma" data-act="abrir-prospect" data-id="' + esc(p.id) + '">Abrir</button></div></li>';
      }).join('') + '</ul>';
    }
    out += '</div></section>';

    // barra de ferramentas
    out += '<div class="barra-fer"><button class="btn primario" data-act="novo-prospect">+ Novo contato</button>' +
      '<input type="search" id="busca-pros" placeholder="Buscar nome, negócio, cidade…" value="' + esc(u.pBusca) + '" data-input="busca-pros" aria-label="Buscar contatos">' +
      '<select data-change="filtro-pros" data-filtro="pEtapa" aria-label="Etapa"><option value="">Todas as etapas</option>' + C.ETAPAS.map(function (e) { return '<option value="' + e.id + '"' + (u.pEtapa === e.id ? ' selected' : '') + '>' + esc(e.nome) + '</option>'; }).join('') + '</select>' +
      '<select data-change="filtro-pros" data-filtro="pOrigem" aria-label="Canal"><option value="">Todos os canais</option>' + CANAIS.map(function (c) { return '<option value="' + c[0] + '"' + (u.pOrigem === c[0] ? ' selected' : '') + '>' + c[1] + '</option>'; }).join('') + '</select>' +
      estados(todos) + '<span class="seg" role="radiogroup" aria-label="Vista">' + [['quadro', 'Quadro'], ['lista', 'Lista'], ['funil', 'Funil']].map(function (v) {
        return '<label><input type="radio" name="vista" value="' + v[0] + '"' + (u.pVista === v[0] ? ' checked' : '') + ' data-change="pros-vista"><span style="width:auto;padding:0 14px;font-family:var(--f-body);font-weight:700">' + v[1] + '</span></label>';
      }).join('') + '</span>' +
      '<span class="barra-fer-fim"><button class="btn" data-act="importar">Importar planilha</button><button class="btn" data-act="exportar-csv">Exportar CSV</button>' +
      (todos.length ? '<button class="btn perigo" data-act="apagar-todos">Apagar todos</button>' : '') +
      (S.temExemplos() ? '<button class="btn fantasma" data-act="limpar-exemplos">Limpar exemplos</button>' : '<button class="btn fantasma" data-act="carregar-exemplos">Exemplo</button>') + '</span></div>';

    if (u.novoAberto) out += formNovo();

    if (!todos.length) return out + '<div class="vazio"><p><strong>Nenhum contato ainda.</strong></p><p style="margin-top:6px">Comece cadastrando 20 contatos do mesmo nicho (um nicho por lote deixa o script específico e a taxa de resposta sobe), ou importe sua planilha. Os leads do tráfego pago também caem aqui.</p></div>';
    var vis = filtrar(todos);
    out += '<div id="vista-pros">' + (u.pVista === 'lista' ? lista(h, vis) : u.pVista === 'funil' ? funilHTML(todos) : quadro(h, vis)) + '</div>';
    return out;
  };

  BC.act['pros-vista'] = function (el) { BC.ui.pVista = el.value; BC.render(); };
  BC.act['filtro-pros'] = function (el) { BC.ui[el.dataset.filtro] = el.value; BC.render(); };
  BC.act['busca-pros'] = function (el) {
    BC.ui.pBusca = el.value;
    var alvo = document.getElementById('vista-pros'); if (!alvo) return;
    var vis = filtrar(S.all('prospects')), h = C.hoje();
    alvo.innerHTML = BC.ui.pVista === 'lista' ? lista(h, vis) : (BC.ui.pVista === 'funil' ? alvo.innerHTML : quadro(h, vis));
  };
  BC.act['meta-dia'] = function (el) {
    var n = Math.max(1, Math.min(200, parseInt(el.value, 10) || 5));
    S.setCfg('meta_diaria', n);
  };
  BC.act['novo-prospect'] = function () {
    BC.ui.novoAberto = !BC.ui.novoAberto;
    if (location.hash !== '#prospeccao') { location.hash = '#prospeccao'; return; }
    BC.render();
    var f = document.getElementById('form-novo');
    if (f) { if (f.scrollIntoView) f.scrollIntoView({ block: 'center', behavior: 'smooth' }); var i = document.getElementById('nc-nome'); if (i) i.focus({ preventScroll: true }); }
  };
  BC.act['cancelar-novo'] = function () { BC.ui.novoAberto = false; BC.render(); };

  // ───────── apagar contatos em massa ─────────
  function refrescaLista() {
    var alvo = document.getElementById('vista-pros');
    if (alvo && BC.ui.pVista === 'lista') alvo.innerHTML = lista(C.hoje(), filtrar(S.all('prospects')));
  }
  BC.act['sel-pros'] = function (el) {
    var sel = BC.ui.sel || (BC.ui.sel = {}), id = el.dataset.id;
    if (sel[id]) delete sel[id]; else sel[id] = true;
    refrescaLista();
  };
  BC.act['sel-todos'] = function () {
    var vis = filtrar(S.all('prospects')), sel = BC.ui.sel || (BC.ui.sel = {});
    if (selecionados(vis).length === vis.length) vis.forEach(function (p) { delete sel[p.id]; });
    else vis.forEach(function (p) { sel[p.id] = true; });
    refrescaLista();
  };
  BC.act['sel-limpar'] = function () { BC.ui.sel = {}; refrescaLista(); };

  function abrirApagar(modo) {
    var todos = S.all('prospects'), alvo = modo === 'todos' ? todos : selecionados(filtrar(todos));
    if (!alvo.length) { BC.toast('Nenhum contato selecionado.', true); return; }
    var n = alvo.length, txt = n === 1 ? '1 contato' : n + ' contatos';
    var html = '<form class="dlg" data-form="apagar-prospects" data-modo="' + modo + '">' + BC.cabDialogo('Apagar ' + txt + '?', modo === 'todos' ? 'Todos os contatos do CRM' : 'Os contatos que você marcou na lista') +
      '<p style="margin:0 0 8px">Isso apaga ' + (n === 1 ? 'o contato' : 'os contatos') + ' e o histórico de toques. <strong>Não dá para desfazer.</strong> Clientes que você já fechou continuam na carteira.</p>' +
      '<p class="small muted" style="margin:0 0 12px">Quer guardar uma cópia antes? Feche esta janela e use "Exportar CSV".</p>' +
      (modo === 'todos' ? '<div class="campo"><label for="ap-conf">Para confirmar, digite APAGAR</label><input id="ap-conf" name="conf" autocomplete="off" placeholder="APAGAR"></div>' : '') +
      '<p class="erro-form" hidden role="alert"></p>' +
      '<div class="dlg-rodape"><button type="button" class="btn" data-act="fechar">Cancelar</button><button type="submit" class="btn perigo">Apagar ' + txt + '</button></div></form>';
    BC.dialogo(html, { estreito: true });
  }
  BC.act['apagar-sel'] = function () { abrirApagar('sel'); };
  BC.act['apagar-todos'] = function () { abrirApagar('todos'); };
  BC.forms['apagar-prospects'] = function (form) {
    var modo = form.dataset.modo, d = BC.dados(form);
    if (modo === 'todos' && String(d.conf || '').trim().toUpperCase() !== 'APAGAR') {
      var er = form.querySelector('.erro-form'); er.textContent = 'Digite APAGAR para confirmar.'; er.hidden = false; return;
    }
    var todos = S.all('prospects'), alvo = modo === 'todos' ? todos : selecionados(filtrar(todos));
    var ids = alvo.map(function (p) { return p.id; });
    BC.seguro(async function () {
      var set = {}; ids.forEach(function (i) { set[i] = 1; });
      await S.removeMany('atividades', S.all('atividades').filter(function (a) { return set[a.prospect_id]; }).map(function (a) { return a.id; }));
      await S.removeMany('prospects', ids);
      // listas que ficaram sem nenhum contato saem junto
      var vivas = {}; S.all('prospects').forEach(function (p) { if (p.lista_id) vivas[p.lista_id] = 1; });
      await S.removeMany('listas', S.all('listas').filter(function (l) { return !vivas[l.id]; }).map(function (l) { return l.id; }));
      BC.ui.sel = {}; BC.ui.pLista = '';
      BC.fechar(form); BC.toast(ids.length === 1 ? 'Contato apagado.' : ids.length + ' contatos apagados.');
    }, form);
  };

  BC.act['exportar-csv'] = function () {
    var cols = [['nome', 'Nome'], ['negocio', 'Negócio'], ['nicho', 'Nicho'], ['cidade', 'Cidade'], ['estado', 'Estado'], ['telefone', 'Telefone'], ['email', 'E-mail'], ['instagram', 'Instagram'], ['origem', 'Origem'], ['canal', 'Canal'], ['etapa', 'Etapa'], ['toques', 'Toques'], ['proxima_data', 'Próxima etapa'], ['notas', 'Notas']];
    function cel(v) { v = v == null ? '' : String(v); return /[";\n,]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
    var linhas = [cols.map(function (c) { return c[1]; }).join(',')].concat(S.all('prospects').map(function (p) { return cols.map(function (c) { return cel(c[0] === 'etapa' ? BC.nomeEtapa(p.etapa) : p[c[0]]); }).join(','); }));
    var csv = linhas.join('\n');
    try { navigator.clipboard.writeText(csv).then(function () { BC.toast('CSV copiado. Cole em uma planilha.'); }, function () { baixar(csv); }); } catch (e) { baixar(csv); }
    function baixar(txt) {
      try { var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + txt], { type: 'text/csv' })); a.download = 'prospeccao.csv'; document.body.appendChild(a); a.click(); a.remove(); BC.toast('CSV exportado.'); }
      catch (e2) { BC.toast('Não consegui exportar neste navegador.', true); }
    }
  };

  // ───────── arrastar cartões entre colunas (mouse e toque) ─────────
  // No celular, segure o cartão por um instante para pegar; deslizar logo de cara continua rolando a tela.
  (function () {
    var st = null, ultimoArrasto = 0, ultimoToque = 0;

    function colEm(x, y) {
      var e = document.elementFromPoint(x, y);
      return e && e.closest ? e.closest('.quadro .col') : null;
    }
    function inicio(ev, x, y, toque) {
      if (st || !ev.target.closest) return;
      var el = ev.target.closest('.quadro .cartao'); if (!el) return;
      if (ev.target.closest('a, button, input, select, textarea')) return;
      st = { el: el, id: el.dataset.id, x0: x, y0: y, x: x, y: y, ativo: false, toque: toque, fant: null, col: null, timer: null, loop: null };
      if (toque) st.timer = setTimeout(function () { if (st && !st.ativo) comecar(); }, 280);
    }
    function comecar() {
      var r = st.el.getBoundingClientRect();
      st.ativo = true; st.dx = st.x - r.left; st.dy = st.y - r.top;
      var f = st.el.cloneNode(true);
      f.removeAttribute('data-act'); f.removeAttribute('data-id'); f.removeAttribute('tabindex');
      f.classList.add('cartao-fantasma'); f.style.width = r.width + 'px';
      document.body.appendChild(f); st.fant = f;
      st.el.classList.add('arrastando'); document.body.classList.add('arrastando-cartao');
      try { if (st.toque && navigator.vibrate) navigator.vibrate(15); } catch (e) {}
      st.loop = setInterval(posicionar, 30);
      posicionar();
    }
    function posicionar() {
      if (!st || !st.ativo) return;
      st.fant.style.left = (st.x - st.dx) + 'px'; st.fant.style.top = (st.y - st.dy) + 'px';
      var q = document.querySelector('.quadro');
      if (q) {
        var qr = q.getBoundingClientRect();
        if (st.x < qr.left + 56) q.scrollLeft -= 14; else if (st.x > qr.right - 56) q.scrollLeft += 14;
      }
      if (st.y < 70) window.scrollBy(0, -14); else if (st.y > window.innerHeight - 70) window.scrollBy(0, 14);
      var col = colEm(st.x, st.y);
      if (col !== st.col) {
        if (st.col) st.col.classList.remove('alvo');
        if (col) col.classList.add('alvo');
        st.col = col;
      }
    }
    function mover(ev, x, y) {
      if (!st) return;
      st.x = x; st.y = y;
      if (!st.ativo) {
        var d = Math.abs(x - st.x0) + Math.abs(y - st.y0);
        if (st.toque) { if (d > 10) fim(true); return; }
        if (d < 6) return;
        comecar();
      }
      if (ev.cancelable) ev.preventDefault();
      posicionar();
    }
    function fim(cancelar) {
      if (!st) return;
      var s = st; st = null;
      clearTimeout(s.timer); clearInterval(s.loop);
      if (!s.ativo) return;
      if (s.fant) s.fant.remove();
      s.el.classList.remove('arrastando');
      if (s.col) s.col.classList.remove('alvo');
      document.body.classList.remove('arrastando-cartao');
      ultimoArrasto = Date.now();
      if (cancelar) return;
      var col = colEm(s.x, s.y);
      if (col && col.dataset.etapa) BC.moverProspect(s.id, col.dataset.etapa);
    }

    document.addEventListener('mousedown', function (ev) {
      if (ev.button !== 0 || Date.now() - ultimoToque < 700) return;
      inicio(ev, ev.clientX, ev.clientY, false);
    });
    document.addEventListener('mousemove', function (ev) { if (st && !st.toque) mover(ev, ev.clientX, ev.clientY); });
    document.addEventListener('mouseup', function () { if (st && !st.toque) fim(false); });
    document.addEventListener('touchstart', function (ev) {
      ultimoToque = Date.now();
      if (ev.touches.length !== 1) { fim(true); return; }
      inicio(ev, ev.touches[0].clientX, ev.touches[0].clientY, true);
    }, { passive: true });
    document.addEventListener('touchmove', function (ev) {
      if (st && st.toque && ev.touches.length) mover(ev, ev.touches[0].clientX, ev.touches[0].clientY);
    }, { passive: false });
    document.addEventListener('touchend', function () { ultimoToque = Date.now(); if (st && st.toque) fim(false); });
    document.addEventListener('touchcancel', function () { if (st && st.toque) fim(true); });
    document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') fim(true); });
    // depois de arrastar, o "clique" de soltar não pode abrir o cartão
    document.addEventListener('click', function (ev) {
      if (Date.now() - ultimoArrasto < 400) { ev.stopPropagation(); ev.preventDefault(); }
    }, true);
  })();
})(window);

</script>
<script>
/* Agência BC · roteador, delegação de eventos e inicialização. */
(function (root) {
  'use strict';
  var BC = root.BC, S = root.BCStore, esc = BC.esc;
  var ROTAS = [['painel', 'Painel'], ['clientes', 'Clientes'], ['prospeccao', 'CRM'], ['previsao', 'Previsão'], ['churn', 'Churn'], ['dados', 'Dados']];
  var pronto = false;

  function rota() {
    var h = (location.hash || '').replace(/^#/, '') || 'painel';
    if (h.indexOf('c-') === 0) return { nome: 'cliente', id: h.slice(2), nav: 'clientes' };
    if (!BC.views[h]) h = 'painel';
    return { nome: h, nav: h };
  }

  // Espaço da logo: coloque o arquivo em assets/ e informe o caminho em LOGO (js/config.js). Vazio = espaço reservado.
  function logo() {
    var l = root.BC_CONFIG && root.BC_CONFIG.LOGO;
    return l ? '<img class="marca-logo" src="' + esc(l) + '" alt="Logo">' : '<span class="marca-logo vazio" aria-hidden="true"></span>';
  }
  function barra(nav) {
    var sup = S.modo() === 'supabase';
    return '<header class="topbar"><div class="topbar-in"><a class="marca" href="#painel">' + logo() + '<span class="marca-nome">Agência BC</span></a>' +
      '<div class="topbar-acoes">' + (sup ? '<button class="btn mini fantasma" data-act="sair">Sair</button>' : '<span class="tag" title="Os dados ficam só neste navegador até ligarmos o Supabase">modo local</span>') +
      '<button class="btn mini fantasma" data-act="tema" aria-label="Alternar tema">Tema</button></div></div>' +
      '<nav class="nav" aria-label="Seções">' + ROTAS.map(function (r) { return '<a href="#' + r[0] + '"' + (r[0] === nav ? ' aria-current="page"' : '') + '>' + r[1] + '</a>'; }).join('') + '</nav></header>';
  }

  BC.render = function () {
    if (!pronto) return;
    var r = rota(), app = document.getElementById('app'), html;
    try { html = r.nome === 'cliente' ? BC.views.cliente(r.id) : BC.views[r.nome](); }
    catch (e) { console.error(e); html = '<div class="aviso warn"><span>Algo deu errado ao montar esta tela: ' + esc(e.message) + '</span></div>'; }
    var y = window.scrollY, foco = document.activeElement && document.activeElement.id;
    app.innerHTML = barra(r.nav) + '<main class="pagina">' + html + '</main>';
    if (foco) { var el = document.getElementById(foco); if (el && el.focus) { try { el.focus({ preventScroll: true }); if (el.setSelectionRange && el.type === 'search') el.setSelectionRange(el.value.length, el.value.length); } catch (e) { /* ok */ } } }
    window.scrollTo(0, y);
  };

  function tema() {
    var r = document.documentElement, atual = r.getAttribute('data-theme');
    var escuro = atual !== 'light';
    var novo = escuro ? 'light' : 'dark';
    r.setAttribute('data-theme', novo);
    try { localStorage.setItem('bc:tema', novo); } catch (e) { /* ok */ }
  }
  BC.act['fechar'] = function (el) { BC.fechar(el); };
  BC.act['tema'] = tema;
  BC.act['sair'] = async function () { await root.BCSupabase.sair(); location.reload(); };

  function achar(el, attr) { return el && el.closest ? el.closest('[' + attr + ']') : null; }
  function roda(nome, el, ev) {
    var f = BC.act[nome];
    if (!f) { console.warn('ação desconhecida', nome); return; }
    var r = f(el, ev);
    if (r && r.catch) r.catch(function (e) { console.error(e); BC.toast(e.message || 'Algo deu errado', true); });
  }

  document.addEventListener('click', function (ev) {
    var lk = ev.target.closest && ev.target.closest('a[href]');
    if (lk && !lk.hasAttribute('data-act')) return; // links normais (WhatsApp, e-mail...) seguem o caminho deles
    var el = achar(ev.target, 'data-act');
    if (!el) return;
    if (ev.target.closest('a[href], button, input, select') && ev.target.closest('a[href], button, input, select') !== el && el.tagName !== 'BUTTON' && el.tagName !== 'A') {
      // clique em botão/link dentro de um cartão clicável: o botão interno manda
      var interno = ev.target.closest('[data-act]');
      if (interno && interno !== el) el = interno;
    }
    if (el.tagName === 'A' && el.getAttribute('data-act') === 'fechar-e-ir') { roda('fechar-e-ir', el, ev); return; }
    ev.preventDefault();
    roda(el.getAttribute('data-act'), el, ev);
  });
  document.addEventListener('change', function (ev) {
    var el = achar(ev.target, 'data-change');
    if (el) roda(el.getAttribute('data-change'), el, ev);
    var live = ev.target.closest && ev.target.closest('[data-live]');
    if (live && BC.live[live.dataset.live]) BC.live[live.dataset.live](live);
  });
  document.addEventListener('input', function (ev) {
    var el = achar(ev.target, 'data-input');
    if (el) roda(el.getAttribute('data-input'), el, ev);
    var live = ev.target.closest && ev.target.closest('[data-live]');
    if (live && BC.live[live.dataset.live]) BC.live[live.dataset.live](live);
  });
  document.addEventListener('submit', function (ev) {
    var f = ev.target.closest('[data-form]');
    if (!f) return;
    ev.preventDefault();
    var fn = BC.forms[f.dataset.form];
    if (fn) fn(f);
  });
  window.addEventListener('hashchange', function () { window.scrollTo(0, 0); BC.render(); });

  function telaLogin(msg) {
    document.getElementById('app').innerHTML = '<form class="login" id="form-login"><h1 style="font-family:var(--f-tit,inherit)">Agência <span style="color:var(--accent)">BC</span></h1>' +
      '<div class="campo"><label for="lg-email">E-mail</label><input id="lg-email" type="email" autocomplete="username" required></div>' +
      '<div class="campo"><label for="lg-senha">Senha</label><input id="lg-senha" type="password" autocomplete="current-password" required></div>' +
      '<p class="erro-form" role="alert"' + (msg ? '' : ' hidden') + '>' + esc(msg || '') + '</p><button class="btn primario" type="submit">Entrar</button></form>';
    document.getElementById('form-login').addEventListener('submit', async function (ev) {
      ev.preventDefault();
      try { await root.BCSupabase.entrar(document.getElementById('lg-email').value, document.getElementById('lg-senha').value); location.reload(); }
      catch (e) { telaLogin('E-mail ou senha incorretos.'); }
    });
  }

  async function iniciar() {
    try { var t = localStorage.getItem('bc:tema'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) { /* ok */ }
    try { await S.init(); }
    catch (e) {
      if (e.precisaLogin) return telaLogin();
      document.getElementById('app').innerHTML = '<main class="pagina"><div class="aviso warn"><span>Não consegui iniciar: ' + esc(e.message) + '</span></div></main>';
      return;
    }
    S.onChange(function () { BC.render(); });
    pronto = true;
    BC.render();
  }
  BC.iniciar = iniciar;
  if (!root.__BC_SEM_AUTO) iniciar();
})(window);

</script>
</body>
</html>
